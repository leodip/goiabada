server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Every page is UTF-8, and so are the text files the build writes.
    charset utf-8;

    # Redirects carry a relative Location, because nginx's own scheme and port are
    # not the reader's: behind a proxy terminating TLS, an absolute one sends the
    # reader to plain HTTP.
    absolute_redirect off;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml+rss image/svg+xml;

    # Security headers. A location that declares an add_header of its own
    # inherits none of these, so the asset location below repeats them.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # A built file or a page, and nothing else. A page is a directory holding an
    # index.html; asked without its trailing slash, it is a 301 to the path with
    # it. Any other path, a directory with no page in it included, is a 404 with
    # the site's 404 page, which offers search and the home page: the home page
    # under every unknown path read as a soft 404.
    #
    # The condition is true only for a page's directory, with or without the
    # slash. Without it, the rewrite answers. With it, the request is handled
    # inside the if, where try_files does not apply, and the index directive
    # serves the page's index.html. A wider condition, such as -d, would let a
    # directory with no page reach nginx's 403 that way.
    location / {
        if (-f $request_filename/index.html) {
            rewrite ^(.*[^/])$ $1/ permanent;
        }
        try_files $uri $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
