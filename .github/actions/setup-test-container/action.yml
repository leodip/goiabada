# Shared setup for the container-based test jobs in check.yml: the data and
# integration jobs, which run in the golang container to reach their databases on
# the job's network. The unit and race jobs run on the runner and use
# setup-test-runner instead.
#
# The golang:*-bookworm image is close to what run-tests.sh needs but not
# identical, and every database job needs the same four steps. Debian rather than
# alpine, because GitHub injects a glibc-linked Node.js runtime into container
# jobs to execute actions, which does not run on musl.

name: Set up test container
description: Install the OS packages, Tailwind CLI, Node.js and Go caches that run-tests.sh and build.sh need.

inputs:
  tailwind:
    description: Tailwind CLI version, from versions.yaml
    required: true
  node:
    description: Node.js version, from versions.yaml
    required: true
  save-cache:
    description: Save the Go cache at the end of the job when its key is new ('true' in one job only)
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    # The checkout belongs to the runner's user and this image runs as root, so
    # git refuses it as dubious ownership. actions/checkout marks it safe only
    # under a temporary HOME the later steps never see. The literal-secret guard
    # lists the tracked files with git ls-files, and in CI a git that cannot
    # answer stops it (#501).
    - name: Mark the checkout safe for git
      shell: bash
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    # net-tools supplies netstat, which run-tests.sh's kill_processes_on_ports
    # uses. Without it that function silently finds nothing rather than
    # failing, so a stale listener would go unnoticed. jq reads the GitHub
    # API's answer when install-tailwind falls back to it.
    - name: Install OS packages
      shell: bash
      run: |
        set -euo pipefail
        apt-get update -qq
        apt-get install -y -qq --no-install-recommends net-tools curl zip ca-certificates jq

    # The glibc build, which the Debian image runs.
    - name: Install Tailwind CLI
      uses: ./.github/actions/install-tailwind
      with:
        version: ${{ inputs.tailwind }}

    # The binary alone, which core/guard's script check runs acorn under. Not the Node.js runtime
    # GitHub injects into container jobs for actions, which is on no PATH and follows no pin.
    - name: Install Node.js
      shell: bash
      run: |
        set -euo pipefail
        curl -sfL --retry 3 --retry-delay 5 \
          "https://nodejs.org/dist/v${{ inputs.node }}/node-v${{ inputs.node }}-linux-x64.tar.gz" |
          tar -xz -C /usr/local --strip-components=1 --no-same-owner "node-v${{ inputs.node }}-linux-x64/bin/node"
        node --version

    # Where Go keeps its modules and its build output, asked of go itself. The build cache is
    # under HOME, which GitHub sets to /github/home in a container job, not root's home. The Go
    # version is part of the key, since one toolchain's build output is no use to another.
    - name: Locate the Go caches
      shell: bash
      run: |
        {
          echo "GO_MODULES_DIR=$(go env GOMODCACHE)"
          echo "GO_BUILD_OUTPUT_DIR=$(go env GOCACHE)"
          echo "GO_TOOLCHAIN_VERSION=$(go env GOVERSION)"
        } >> "$GITHUB_ENV"

    # Every job restores the cache and one saves it: the job that passes save-cache, Data /
    # sqlite. It compiles what the other database jobs compile too, so they restore the auth
    # server's build rather than compile it. The runner jobs keep their own cache under the
    # runner's paths, which this one is never restored from. A key is new after every go.sum
    # change, and saving one compresses the whole cache, which one job pays rather than every job.
    - name: Cache Go modules and build output
      if: inputs.save-cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ env.GO_MODULES_DIR }}
          ${{ env.GO_BUILD_OUTPUT_DIR }}
        key: ${{ runner.os }}-${{ env.GO_TOOLCHAIN_VERSION }}-${{ hashFiles('src/**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-${{ env.GO_TOOLCHAIN_VERSION }}-
    - name: Restore Go modules and build output
      if: inputs.save-cache != 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ env.GO_MODULES_DIR }}
          ${{ env.GO_BUILD_OUTPUT_DIR }}
        key: ${{ runner.os }}-${{ env.GO_TOOLCHAIN_VERSION }}-${{ hashFiles('src/**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-${{ env.GO_TOOLCHAIN_VERSION }}-
