# Dependabot keeps the pins from going stale. Unattended stale pins are worse
# than moving tags: they look deliberate.
#
# Deliberately NOT covered here: the Go toolchain version, the Tailwind CLI,
# mockery, staticcheck, unparam, govulncheck, Trivy, Grype and the CDN script tags.
# Dependabot cannot see any of them -- they are shell downloads, `go install`s,
# Dockerfile pins and script tags in HTML rather than package manifests. Those stay
# `./version-manager.sh check` territory. The two tools are complementary: what
# they share is the Go and npm upgrades below, which `./version-manager.sh deps`
# makes all at once on a maintainer's machine, where Dependabot opens a pull
# request for each.
#
# Every entry waits 3 days after a release before proposing it, the age
# `./version-manager.sh` holds its own suggestions and upgrades to: a release that
# turns out poisoned is usually pulled within hours (#520). Security updates do
# not wait.

version: 2

updates:
  # Covers the workflows in .github/workflows AND every composite action in
  # .github/actions/*. The glob matters: `directory: /` scans .github/workflows
  # ONLY, so an action.yml elsewhere is invisible to Dependabot and silently
  # keeps whatever pin it was born with -- which is worse than being unpinned,
  # because it looks maintained.
  #
  # That is not hypothetical. actions/cache was bumped v4 -> v6.1.0 across the
  # workflows while the copy in .github/actions/setup-test-container stayed on
  # v4, leaving two majors of one action in use. Naming that directory
  # explicitly would fix today and break again the next time someone adds a
  # composite action, so the pattern is a glob.
  #
  # Without this, the SHA pins would freeze forever, which is the standard
  # objection to pinning and the reason pinning without Dependabot is a trap.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    commit-message:
      prefix: ci

  # One entry per module: Dependabot does not discover Go workspaces
  # recursively, and each go.mod is its own dependency graph.
  - package-ecosystem: gomod
    directory: /src/core
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    commit-message:
      prefix: deps

  - package-ecosystem: gomod
    directory: /src/authserver
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    commit-message:
      prefix: deps

  - package-ecosystem: gomod
    directory: /src/adminconsole
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    commit-message:
      prefix: deps

  - package-ecosystem: gomod
    directory: /src/cmd/goiabada-setup
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    commit-message:
      prefix: deps

  # The docs site's build: Astro, Starlight and their plugins. Nothing here
  # reaches the docs image, which serves the built files with nginx, but the
  # build runs in CI and on every contributor's machine.
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    commit-message:
      prefix: deps

  # The e2e suite: Playwright, whose version sets the browser builds the suite
  # runs, and its type checking.
  - package-ecosystem: npm
    directory: /e2e/playwright
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    commit-message:
      prefix: deps

  # The test app: a Next.js app that follows the guides, which the e2e suite
  # signs in through as a web app, an SPA and an API.
  - package-ecosystem: npm
    directory: /e2e/testapp
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    commit-message:
      prefix: deps
