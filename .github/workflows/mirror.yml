# Copies the images CI pulls from Docker Hub into public packages under ghcr.io/leodip/goiabada-ci/,
# so CI can pull them without drawing on Docker Hub's allowance of 200 pulls per 6 hours, which a
# few Check runs in one hour used up (#867). .github/mirror/images lists the tags, their versions
# read from src/authserver/versions.yaml, and .github/mirror/mirror.sh does the work; it says how.
#
# It runs on a push to any branch of this repository that changes what it mirrors, so a version
# bump is copied by the push that makes it, on any branch, before or beside that push's own Check
# run; weekly, from main, to follow the tags upstream moves, such as nginx:alpine; and by hand.
# It never runs on a pull request, so no fork's code runs beside its token or Docker Hub's. A tag
# whose digest at the mirror is already upstream's is not copied, so a refresh pulls from Docker
# Hub only what upstream moved. Old tags stay, so a branch on an older pin keeps working.
#
# A new GHCR package may start private, as GitHub documents, and GitHub has no API to change that.
# The Public job reads every tag anonymously, as CI's pull does, its manifests whole and each blob's
# headers alone, so it downloads no layer, and fails naming each package that is not public and
# where to make it public, until the maintainer has.

name: Mirror

on:
  push:
    branches: ["**"]
    paths:
      - .github/mirror/images
      - .github/mirror/mirror.sh
      - .github/workflows/mirror.yml
      - src/authserver/versions.yaml
      - src/build/Dockerfile-authserver
      - src/build/Dockerfile-adminconsole
      - site/Dockerfile
      - e2e/testapp/Dockerfile
  schedule:
    - cron: "23 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  copy:
    name: Copy
    # skopeo, which copies every platform and keeps the digests, ships in this runner image.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    # One copy at a time, of every branch and run, each waiting its turn: a copy compares each tag's
    # digests before it writes, so two at once can both pull one digest, and the one that read
    # upstream first can land the older digest last. queue: max keeps up to 100 waiting, so another
    # branch's refresh, which holds its new tags, is never cancelled for a newer one; a group per
    # branch would let two branches' copies overlap. The Public job only reads, and runs beside.
    concurrency:
      group: mirror-copy
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Docker Hub is read logged in with the read-only token the Image scan uses, so the pulls
      # draw on the account's allowance rather than the one GitHub's runners share by address.
      - name: Copy the tags whose digest differs from upstream's
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/mirror/mirror.sh copy

  public:
    name: Public
    needs: copy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read every image anonymously
        run: .github/mirror/mirror.sh public
