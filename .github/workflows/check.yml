# The PR check suite. This is now the only thing gating a pull request: the
# legacy run-tests.yml it ran beside has been retired, having agreed with this
# workflow on every pull request from the day it was introduced.
#
# The point of the job split is visibility: GitHub renders two levels, jobs in
# the sidebar and steps within a job, so the database goes on the job axis and
# the test tier on the step axis. A red run then names the database without a
# click and the tier with one.
#
# `main` is deliberately left unprotected. The consequence that matters --
# shipping something broken -- is already prevented downstream: release.yml
# re-runs this entire matrix against the tagged commit, refuses a tag that is
# not reachable from origin/main, and gives registry credentials only to a job
# that cannot start until those checks are green. Branch protection would move
# detection earlier, not make it possible.

name: Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:
    inputs:
      full:
        description: Run the jobs that are otherwise push-only (release.yml passes true)
        type: boolean
        default: false

concurrency:
  group: check-${{ github.ref }}
  # Cancel superseded PR runs, so pushing again to a branch stops burning
  # runners on the previous commit. Never cancel a push to main.
  #
  # This was `true` unconditionally, which was wrong: `Build validation` runs
  # ONLY on push (4.5), and it is the sole job that exercises the release path
  # -- five cross-compiles plus both Docker images. Merging two PRs in quick
  # succession cancelled the first one's run, so a commit landed on main having
  # never had its build path validated, which is precisely what that job exists
  # to prevent. Observed on 4dd17c8.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Test-only values, copied as literals from src/build/docker-compose-test.yml.
# These are fixed test credentials, not secrets: keeping them literal is what
# lets a developer reproduce a CI failure locally. Declared once at workflow
# level because GitHub does not support YAML anchors in workflow files, and
# every container job needs the same block.
#
# The database variables are deliberately absent: run-tests.sh's
# configure_database sets them per database, and that function is the reason CI
# can reuse the script unchanged.
env:
  TZ: Europe/Lisbon

  GOIABADA_ADMIN_EMAIL: admin@example.com
  GOIABADA_ADMIN_PASSWORD: changeme
  GOIABADA_APPNAME: Goiabada

  GOIABADA_AUTHSERVER_BASEURL: http://localhost:19090
  # The compose file points this at the goiabada-test container by name. In a
  # container job the server and the tests share one container, so localhost is
  # the equivalent.
  GOIABADA_AUTHSERVER_INTERNALBASEURL: http://localhost:19090
  GOIABADA_AUTHSERVER_LISTEN_HOST_HTTP: 0.0.0.0
  GOIABADA_AUTHSERVER_LISTEN_PORT_HTTP: "19090"
  GOIABADA_AUTHSERVER_LISTEN_HOST_HTTPS: ""
  GOIABADA_AUTHSERVER_LISTEN_PORT_HTTPS: ""
  GOIABADA_AUTHSERVER_CERTFILE: ""
  GOIABADA_AUTHSERVER_KEYFILE: ""
  GOIABADA_AUTHSERVER_TRUST_PROXY_HEADERS: "false"
  GOIABADA_AUTHSERVER_RATELIMITER_ENABLED: "false"
  GOIABADA_AUTHSERVER_LOG_HTTP_REQUESTS: "false"
  GOIABADA_AUTHSERVER_LOG_SQL: "false"
  GOIABADA_AUTHSERVER_STATICDIR: ""
  GOIABADA_AUTHSERVER_TEMPLATEDIR: ""
  GOIABADA_AUTHSERVER_SESSION_AUTHENTICATION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  GOIABADA_AUTHSERVER_SESSION_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  GOIABADA_AES_ENCRYPTION_KEY: 00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff
  GOIABADA_AUTHSERVER_BOOTSTRAP_ENV_OUTFILE: /tmp/bootstrap.env

  GOIABADA_ADMINCONSOLE_BASEURL: http://localhost:19091
  GOIABADA_ADMINCONSOLE_LISTEN_HOST_HTTP: 0.0.0.0
  GOIABADA_ADMINCONSOLE_LISTEN_PORT_HTTP: "19091"
  GOIABADA_ADMINCONSOLE_LISTEN_HOST_HTTPS: ""
  GOIABADA_ADMINCONSOLE_LISTEN_PORT_HTTPS: ""
  GOIABADA_ADMINCONSOLE_CERTFILE: ""
  GOIABADA_ADMINCONSOLE_KEYFILE: ""
  GOIABADA_ADMINCONSOLE_TRUST_PROXY_HEADERS: "false"
  GOIABADA_ADMINCONSOLE_LOG_HTTP_REQUESTS: "false"
  GOIABADA_ADMINCONSOLE_STATICDIR: ""
  GOIABADA_ADMINCONSOLE_TEMPLATEDIR: ""
  GOIABADA_ADMINCONSOLE_SESSION_AUTHENTICATION_KEY: fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210
  GOIABADA_ADMINCONSOLE_SESSION_ENCRYPTION_KEY: fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210

jobs:
  # Every other job reads its tool versions from here, so versions.yaml stays
  # the single source of truth and nothing is copied into this file. This job
  # MUST be in the required-check list: GitHub counts a skipped job as
  # successful, so if this failed and were not itself required, every dependent
  # job would skip, count as passing, and leave the PR mergeable with nothing
  # having run.
  versions:
    name: Versions
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.read.outputs.go }}
      tailwind: ${{ steps.read.outputs.tailwind }}
      golangci: ${{ steps.read.outputs.golangci }}
      unparam: ${{ steps.read.outputs.unparam }}
      govulncheck: ${{ steps.read.outputs.govulncheck }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: read
        run: |
          set -euo pipefail
          f=src/authserver/versions.yaml
          for k in go tailwind unparam govulncheck; do
            v=$(yq -r ".tools.$k" "$f")
            [ -n "$v" ] && [ "$v" != "null" ] || { echo "::error::tools.$k missing from $f"; exit 1; }
            echo "$k=$v" >> "$GITHUB_OUTPUT"
          done
          v=$(yq -r '.tools."golangci-lint"' "$f")
          [ -n "$v" ] && [ "$v" != "null" ] || { echo "::error::tools.golangci-lint missing from $f"; exit 1; }
          echo "golangci=$v" >> "$GITHUB_OUTPUT"

  lint:
    name: Lint
    needs: versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ needs.versions.outputs.go }}
          cache-dependency-path: src/**/go.sum

      # Both linters are compiled from source by `go install`, which dominated
      # this job: 182s, almost none of it linting. setup-go's cache covers
      # module downloads, not built binaries, so cache the binaries themselves.
      #
      # The key is the pinned versions, so a bump in versions.yaml misses the
      # cache and rebuilds exactly once. That is also why this cannot serve a
      # stale linter: the version is in the key, not merely in the install
      # command.
      #
      # The Go version is part of the key for a different reason: these tools
      # parse this repository with the go/types compiled into them, which is the
      # one from the toolchain that built them. A copy built with the previous
      # Go cannot read a module that declares the new one, and every package
      # fails with "package requires newer Go version". So a Go bump has to miss
      # this cache as surely as a linter bump does.
      - name: Cache linter binaries
        id: linter-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin
          key: linters-${{ runner.os }}-go${{ needs.versions.outputs.go }}-golangci${{ needs.versions.outputs.golangci }}-unparam${{ needs.versions.outputs.unparam }}

      # Pinned from versions.yaml. A blocking gate whose definition of "clean"
      # can change on an upstream release is not a gate.
      - name: Install linters
        if: steps.linter-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v${{ needs.versions.outputs.golangci }}
          go install mvdan.cc/unparam@v${{ needs.versions.outputs.unparam }}

      # Fails loudly if the cache restored something unusable or stale, rather
      # than letting a later step fail with a confusing "command not found".
      #
      # `go version -m` reads the module version recorded in the binary, which
      # is what actually proves the cached copy is the pinned one. unparam has
      # no --version flag, and piping its usage output through `head` is a trap:
      # head closes the pipe, unparam takes SIGPIPE, and under `pipefail` the
      # step fails with exit 141 even though the tool is fine.
      - name: Confirm the linters are the pinned versions
        run: |
          set -euo pipefail
          golangci-lint --version
          for tool in golangci-lint unparam; do
            path=$(command -v "$tool") || { echo "::error::$tool not on PATH"; exit 1; }
            go version -m "$path" | awk -v t="$tool" '$1 == "mod" { print t ": " $2 " " $3 }'
          done

      # The standalone staticcheck binary is deliberately not run. It does not
      # ship the QF (quickfix) checks that golangci-lint's bundled copy
      # registers, making it a strict subset that cannot fail when golangci-lint
      # passes. .golangci.yml is the single definition of lint-clean
      # (docs/ci-v2-design.md 5.8).
      - name: gofmt, vet, golangci-lint, unparam
        run: |
          rc=0
          for m in core authserver adminconsole cmd/goiabada-setup; do
            echo "::group::$m"
            (
              cd "src/$m"
              # `gofmt -l` exits 0 and merely prints filenames, so the exit code
              # cannot be relied on here.
              unformatted=$(gofmt -l .)
              if [ -n "$unformatted" ]; then
                echo "::error::$m has unformatted files:"
                echo "$unformatted"
                exit 1
              fi
              go vet ./...            || exit 1
              unparam -exported ./... || exit 1
              golangci-lint run --max-same-issues=0 --max-issues-per-linter=0 ./... || exit 1
            ) || rc=1
            echo "::endgroup::"
          done
          exit $rc

      # The remaining drift risk once the workflows read versions.yaml at run
      # time: someone edits versions.yaml and forgets to run `update`, leaving
      # the Dockerfiles, the four go.mod files and the template CDN pins stale
      # while CI uses the new value.
      #
      # Running `update` here and requiring a clean diff catches any stale
      # target anywhere, in any number of occurrences. That is strictly stronger
      # than asserting each expected literal is present somewhere, which was the
      # earlier proposal: `grep -qF` only asks whether a literal appears at all,
      # and the devcontainer Dockerfile contains the Go archive name three
      # times, so two stale copies and one correct one would have passed.
      #
      # Safe to mutate the checkout: `update` is pure sed and deterministic, and
      # the CI working tree is disposable.
      - name: versions.yaml is applied
        run: |
          set -euo pipefail
          ( cd src/authserver && ./version-manager.sh update >/dev/null )
          if ! git diff --exit-code; then
            echo "::error::versions.yaml was changed without running ./version-manager.sh update — commit the regenerated files"
            exit 1
          fi

      # web/static/main.css is generated by Tailwind and committed, because
      # //go:embed static bakes it into the binary and neither Dockerfile-* nor
      # build-binaries.sh runs Tailwind. The committed file is what ships.
      #
      # That makes staleness invisible in exactly the direction that hurts: add
      # a class to a template, forget to rebuild, and every local run looks
      # right because the local build regenerates it, while the release ships
      # CSS without the rule. Regenerating here and requiring a clean diff is
      # the same shape as the versions.yaml gate above, for the same reason.
      #
      # Same working directory as build.sh, since @source paths in input.css
      # resolve against the stylesheet and the CLI is invoked from the module
      # root.
      - name: Generated CSS is committed
        run: |
          set -euo pipefail
          curl -sfL --retry 3 --retry-delay 5 \
            "https://github.com/tailwindlabs/tailwindcss/releases/download/v${{ needs.versions.outputs.tailwind }}/tailwindcss-linux-x64" \
            -o /usr/local/bin/tailwindcss
          chmod +x /usr/local/bin/tailwindcss
          for m in authserver adminconsole; do
            ( cd "src/$m" && tailwindcss -i ./web/tailwindcss/input.css -o ./web/static/main.css >/dev/null )
          done
          if ! git diff --exit-code -- '**/web/static/main.css'; then
            echo "::error::web/static/main.css is stale — run ./build.sh in the affected module and commit the regenerated file"
            exit 1
          fi

  vulnerabilities:
    name: Vulnerabilities
    needs: versions
    runs-on: ubuntu-latest
    # Blocking. It was advisory only for as long as GO-2025-3884
    # (github.com/gorilla/csrf) was reachable from core, authserver and
    # adminconsole with no fixed version to move to; #155 removed the dependency
    # from all three modules, and all four report "No vulnerabilities found".
    #
    # This job is unlike every other one here: it fails when a third party
    # publishes an advisory, not when this repository commits a defect, so it
    # can redden a PR that changed nothing. That is intended. A scanner nobody
    # has to act on is one nobody reads, and this gate exists because someone
    # acted on it.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ needs.versions.outputs.go }}
          cache-dependency-path: src/**/go.sum
      # Keyed on the Go version as well as on the pinned govulncheck version,
      # for the same reason as the linter cache above: the binary scans with the
      # go/types it was built against. Leaving Go out of the key is what broke
      # the 1.26 to 1.27 bump, where a cached 1.26 build was restored and
      # reported every package in the repository, and the 1.27 standard library
      # it had to read, as "package requires newer Go version".
      - name: Cache govulncheck
        id: govuln-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin
          key: govulncheck-${{ runner.os }}-go${{ needs.versions.outputs.go }}-${{ needs.versions.outputs.govulncheck }}

      - name: Install govulncheck
        if: steps.govuln-cache.outputs.cache-hit != 'true'
        run: go install golang.org/x/vuln/cmd/govulncheck@v${{ needs.versions.outputs.govulncheck }}
      - name: govulncheck
        run: |
          rc=0
          for m in core authserver adminconsole cmd/goiabada-setup; do
            echo "::group::$m"
            ( cd "src/$m" && govulncheck ./... ) || rc=1
            echo "::endgroup::"
          done
          exit $rc

  unit-core:
    name: Unit / core
    needs: versions
    runs-on: ubuntu-latest
    container: golang:${{ needs.versions.outputs.go }}-bookworm
    services:
      # core's TestSendEmail talks to a real SMTP server. Verified by running
      # the tier without it, where that is the only test that fails.
      mailpit:
        image: axllent/mailpit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-test-container
        with:
          tailwind: ${{ needs.versions.outputs.tailwind }}
      - name: Core module tests
        working-directory: src/authserver
        run: ./run-tests.sh --type core --no-build

  # No services: verified by running this tier with every service unreachable,
  # where it still passes (with Go's test cache defeated, so the tests really
  # ran).
  unit-authserver:
    name: Unit / authserver
    needs: versions
    runs-on: ubuntu-latest
    container: golang:${{ needs.versions.outputs.go }}-bookworm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-test-container
        with:
          tailwind: ${{ needs.versions.outputs.tailwind }}
      - name: Authserver internal tests
        working-directory: src/authserver
        run: ./run-tests.sh --type internal --no-build

  # No services, verified the same way as Unit / authserver.
  unit-adminconsole:
    name: Unit / adminconsole
    needs: versions
    runs-on: ubuntu-latest
    container: golang:${{ needs.versions.outputs.go }}-bookworm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-test-container
        with:
          tailwind: ${{ needs.versions.outputs.tailwind }}
      - name: Admin console module tests
        working-directory: src/authserver
        run: ./run-tests.sh --type adminconsole --no-build

  # The setup wizard is a module of its own with no run-tests.sh tier, so this
  # calls go test directly. Lint and Vulnerabilities have always looped over it,
  # but nothing ran its tests: it had none, and `go test ./...` answering
  # `[no test files]` is indistinguishable from a pass. Its generators emit the
  # compose file, env file and manifests an operator deploys from, so a line
  # reintroduced there ships without anything in the repository reading it
  # (#285).
  #
  # No setup-test-container: this module has four dependencies, no templates and
  # no CSS, so it needs neither the Tailwind CLI nor the OS packages
  # run-tests.sh does, and fetching them would cost more than the run.
  unit-setup:
    name: Unit / setup
    needs: versions
    runs-on: ubuntu-latest
    container: golang:${{ needs.versions.outputs.go }}-bookworm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup wizard tests
        working-directory: src/cmd/goiabada-setup
        run: go test ./... -count=1

  # The four database jobs are written out rather than expressed as a matrix.
  # `matrix` IS available to `services`, so a matrix is possible -- this is a
  # readability choice. Each database needs its own env block, health command
  # and port, and expressing that through per-key conditional expressions trades
  # obvious duplication for expressions that are harder to debug when a health
  # check misbehaves. A naive matrix would also boot all three databases for
  # every leg, and GitHub waits for every service health check before running
  # any step, so the sqlite leg would block on an MSSQL container it never uses.

  tests-sqlite:
    name: Tests / sqlite
    needs: versions
    runs-on: ubuntu-latest
    container: golang:${{ needs.versions.outputs.go }}-bookworm
    services:
      mailpit:
        image: axllent/mailpit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-test-container
        with:
          tailwind: ${{ needs.versions.outputs.tailwind }}
      - name: Build
        working-directory: src/authserver
        run: ./build.sh
      - name: Data tests
        working-directory: src/authserver
        run: ./run-tests.sh --type data --db sqlite --no-build
      - name: Integration tests
        working-directory: src/authserver
        run: ./run-tests.sh --type integration --db sqlite --no-build

  tests-mysql:
    name: Tests / mysql
    needs: versions
    runs-on: ubuntu-latest
    container: golang:${{ needs.versions.outputs.go }}-bookworm
    services:
      # MYSQL_TCP_PORT rather than `command: --port=13306`, because service
      # containers cannot override a container's command. Verified against the
      # image directly. Presenting the devcontainer's exact hostname and port is
      # what lets run-tests.sh run here unchanged.
      mysql-server:
        image: mysql:latest
        env:
          MYSQL_ROOT_PASSWORD: mySqlPass123
          MYSQL_TCP_PORT: 13306
        options: >-
          --health-cmd "mysqladmin ping -uroot -pmySqlPass123 --port=13306 --protocol=tcp"
          --health-interval 3s --health-timeout 3s --health-retries 30
      mailpit:
        image: axllent/mailpit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-test-container
        with:
          tailwind: ${{ needs.versions.outputs.tailwind }}
      - name: Build
        working-directory: src/authserver
        run: ./build.sh
      - name: Data tests
        working-directory: src/authserver
        run: ./run-tests.sh --type data --db mysql --no-build
      - name: Integration tests
        working-directory: src/authserver
        run: ./run-tests.sh --type integration --db mysql --no-build

  tests-postgres:
    name: Tests / postgres
    needs: versions
    runs-on: ubuntu-latest
    container: golang:${{ needs.versions.outputs.go }}-bookworm
    services:
      postgres-server:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: myPostgresPass123
          POSTGRES_DB: goiabada
          PGPORT: 15432
        options: >-
          --health-cmd "pg_isready -U postgres -p 15432"
          --health-interval 3s --health-timeout 3s --health-retries 30
      mailpit:
        image: axllent/mailpit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-test-container
        with:
          tailwind: ${{ needs.versions.outputs.tailwind }}
      - name: Build
        working-directory: src/authserver
        run: ./build.sh
      - name: Data tests
        working-directory: src/authserver
        run: ./run-tests.sh --type data --db postgres --no-build
      - name: Integration tests
        working-directory: src/authserver
        run: ./run-tests.sh --type integration --db postgres --no-build

  tests-mssql:
    name: Tests / mssql
    needs: versions
    runs-on: ubuntu-latest
    container: golang:${{ needs.versions.outputs.go }}-bookworm
    services:
      mssql-server:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: YourStr0ngPassw0rd!
          MSSQL_PID: Express
          MSSQL_TCP_PORT: 11433
        # Longer retries than the others: MSSQL routinely takes 30-60s to pass
        # a health check.
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost,11433 -U sa -P 'YourStr0ngPassw0rd!' -Q 'SELECT 1'"
          --health-interval 5s --health-timeout 5s --health-retries 40
      mailpit:
        image: axllent/mailpit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-test-container
        with:
          tailwind: ${{ needs.versions.outputs.tailwind }}
      - name: Build
        working-directory: src/authserver
        run: ./build.sh
      - name: Data tests
        working-directory: src/authserver
        run: ./run-tests.sh --type data --db mssql --no-build
      - name: Integration tests
        working-directory: src/authserver
        run: ./run-tests.sh --type integration --db mssql --no-build

  # Moves discovery of a broken Dockerfile or cross-compile from "when I tag a
  # release" to "right after the merge", without making every PR pay for it.
  # No registry credentials: --load, never --push.
  build-validation:
    name: Build validation
    needs: versions
    if: github.event_name == 'push' || inputs.full
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ needs.versions.outputs.go }}
          cache-dependency-path: src/**/go.sum
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Install Tailwind
        run: |
          set -euo pipefail
          curl -sfL --retry 3 --retry-delay 5 \
            "https://github.com/tailwindlabs/tailwindcss/releases/download/v${{ needs.versions.outputs.tailwind }}/tailwindcss-linux-x64" \
            -o /usr/local/bin/tailwindcss
          chmod +x /usr/local/bin/tailwindcss
      - name: Cross-compile all platforms
        working-directory: src/build
        run: ./build-binaries.sh
      - name: Cross-compile the setup tool
        working-directory: src/cmd/goiabada-setup
        run: ./build-binaries.sh
      - name: Build both images
        working-directory: src/build
        run: |
          set -euo pipefail
