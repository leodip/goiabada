# Scans the images `latest` points at, every week, because nothing else looks at an image once it is
# published: the Check workflow scans the source on main, and Build validation the images a commit
# builds, so an advisory published after a release reached operators' scanners first (#520).
#
# authserver-latest and adminconsole-latest are read from Docker Hub and GHCR. Publish moves both
# registries' tags to one manifest, so each image's digest is normally scanned once; two digests for
# one tag are each scanned, under the registry's name. Every platform of each image is pulled and
# scanned with Trivy and Grype, two vulnerability databases, so one catches an advisory the other is
# late on, and the image's binary with govulncheck -mode=binary, which says whether the code reaches a
# Go advisory. core/cmd/imagescanreport turns the scans into one issue, labelled security, listing
# what someone can act on: each finding with a fixed version, and each Go finding govulncheck reports
# reachable. Everything else is printed in this run's log.
#
# One issue, found by its title: opened when the list first has an entry, its body rewritten and a
# comment added only when the list changes, so a week with nothing new sends nothing, and closed with
# a comment once the list is empty; the next finding opens a new one. The run stays green when it
# reports findings, since the issue is the signal, and fails only when a scan cannot run: an image
# that cannot be pulled, or a scanner, govulncheck or the report that errors.

name: Image scan

on:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-scan
  cancel-in-progress: false

jobs:
  # The scanners' pins and the Go they are built with come from versions.yaml, as in the Check
  # workflow's versions job, and nothing is copied into this file.
  versions:
    name: Versions
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.read.outputs.go }}
      govulncheck: ${{ steps.read.outputs.govulncheck }}
      trivy: ${{ steps.read.outputs.trivy }}
      grype: ${{ steps.read.outputs.grype }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: read
        run: |
          set -euo pipefail
          f=src/authserver/versions.yaml
          for k in go govulncheck trivy grype; do
            v=$(yq -r ".tools.$k" "$f")
            [ -n "$v" ] && [ "$v" != "null" ] || { echo "::error::tools.$k missing from $f"; exit 1; }
            echo "$k=$v" >> "$GITHUB_OUTPUT"
          done

  scan:
    name: Scan the published images
    needs: versions
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ needs.versions.outputs.go }}
          cache-dependency-path: src/core/go.sum
      # The read-only Docker Hub token the Check workflow pulls with, so the pulls do not count
      # against the allowance GitHub's runners share. GHCR's images pull anonymously.
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Install Trivy
        uses: ./.github/actions/install-scanner
        with:
          name: trivy
          package: github.com/aquasecurity/trivy/cmd/trivy
          version: ${{ needs.versions.outputs.trivy }}
          go-version: ${{ needs.versions.outputs.go }}
      - name: Install Grype
        uses: ./.github/actions/install-scanner
        with:
          name: grype
          package: github.com/anchore/grype/cmd/grype
          version: ${{ needs.versions.outputs.grype }}
          go-version: ${{ needs.versions.outputs.go }}
      - name: Install govulncheck
        uses: ./.github/actions/install-scanner
        with:
          name: govulncheck
          package: golang.org/x/vuln/cmd/govulncheck
          version: ${{ needs.versions.outputs.govulncheck }}
          go-version: ${{ needs.versions.outputs.go }}

      # Each image's digest is read once and everything after it uses the digest, so a release
      # moving `latest` during the run cannot mix two images in one scan. One directory per image
      # and platform, in the layout imagescanreport reads.
      - name: Pull and scan the images
        run: |
          set -euo pipefail
          scans="$RUNNER_TEMP/scans"
          work="$RUNNER_TEMP/work"
          mkdir -p "$scans" "$work"
          index_digest() {
            docker buildx imagetools inspect --format '{{json .Manifest}}' "$1" | jq -er .digest
          }
          targets=()
          for img in authserver adminconsole; do
            hub=$(index_digest "docker.io/leodip/goiabada:$img-latest")
            ghcr=$(index_digest "ghcr.io/leodip/goiabada:$img-latest")
            echo "$img-latest: Docker Hub $hub, GHCR $ghcr"
            if [ "$hub" = "$ghcr" ]; then
              targets+=("$img-latest|docker.io/leodip/goiabada@$hub")
            else
              echo "::warning::$img-latest is $hub at Docker Hub and $ghcr at GHCR; scanning both"
              targets+=("$img-latest at Docker Hub|docker.io/leodip/goiabada@$hub")
              targets+=("$img-latest at GHCR|ghcr.io/leodip/goiabada@$ghcr")
            fi
          done
          n=0
          for target in "${targets[@]}"; do
            name=${target%%|*}
            index=${target#*|}
            repo=${index%@*}
            # Every platform the index names; the attestation manifests beside them are unknown/unknown.
            platforms=$(docker buildx imagetools inspect --raw "$index" \
              | jq -er '.manifests | map(select(.platform.os != "unknown")) | if length == 0 then error("no platform") else .[] end | "\(.platform.os)/\(.platform.architecture) \(.digest)"')
            while read -r platform digest; do
              ref="$repo@$digest"
              n=$((n + 1))
              dir="$scans/$n"
              mkdir -p "$dir"
              echo "$name $platform" > "$dir/image"
              echo "::group::$name $platform ($ref)"
              docker pull -q --platform "$platform" "$ref"
              docker save -o "$work/image.tar" "$ref"
              entrypoint=$(docker image inspect --format '{{index .Config.Entrypoint 0}}' "$ref")
              container=$(docker create --platform "$platform" "$ref")
              docker cp -q "$container:$entrypoint" "$work/binary"
              docker rm "$container" > /dev/null
              trivy image --input "$work/image.tar" --scanners vuln --format json --output "$dir/trivy.json" --no-progress --quiet
              grype "docker-archive:$work/image.tar" -o json --file "$dir/grype.json" -q
              govulncheck -mode=binary -format json "$work/binary" > "$dir/govulncheck.json"
              rm -f "$work/image.tar" "$work/binary"
              docker image rm -f "$ref" > /dev/null
              echo "::endgroup::"
            done <<< "$platforms"
          done

      - name: Write the report
        working-directory: src/core
        run: |
          set -euo pipefail
          go run ./cmd/imagescanreport "$RUNNER_TEMP"/scans/* > "$RUNNER_TEMP/report.md"
          if [ -s "$RUNNER_TEMP/report.md" ]; then
            tee -a "$GITHUB_STEP_SUMMARY" < "$RUNNER_TEMP/report.md"
          else
            echo "Nothing to act on in the published images." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Open, update or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Advisories in the published images"
          report=$(cat "$RUNNER_TEMP/report.md")
          number=$(gh issue list --state open --search "in:title \"$title\"" --json number,title \
            --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -z "$report" ]; then
            if [ -n "$number" ]; then
              gh issue close "$number" --comment "The weekly scan of the published images finds nothing left to act on, so this issue is closed. The next finding opens a new one. Scanned in $RUN_URL."
            fi
            exit 0
          fi
          if [ -z "$number" ]; then
            gh issue create --title "$title" --label security --body "$report"
            exit 0
          fi
          current=$(gh issue view "$number" --json body --jq .body)
          if [ "$current" != "$report" ]; then
            gh issue edit "$number" --body "$report"
            gh issue comment "$number" --body "The list changed; the description now holds this week's. Scanned in $RUN_URL."
          fi
