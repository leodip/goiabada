name: goiabada
services:
  devcontainer:
    build: 
      context: .
      dockerfile: Dockerfile
      args:
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
    volumes:
      - ../..:/workspaces/goiabada
      # The test authority's certificate, which run-tests.sh hands the data tier (#502).
      - db-tls:/db-tls:ro
    # gh reaches the container through the environment, not through a mounted file.
    #
    # There used to be a `~/.config/gh/hosts.yml:/root/.config/gh/hosts.yml` bind here. It
    # never worked on any platform: this container runs as `vscode` (see remoteUser), so gh
    # reads /home/vscode/.config/gh and never looked at /root's. On Windows it was worse
    # than dead -- ~/.config/gh does not exist there, so docker created a directory by that
    # name on the host and mounted it over the file, and gh keeps its token in the
    # Credential Manager rather than in hosts.yml anyway.
    #
    # The bare name passes the host's GH_TOKEN through when it is set and leaves it unset
    # otherwise, which is the one form that behaves the same on Windows, macOS and Linux.
    # Nothing in the image requires it; export it only if you want gh inside the container:
    #
    #   macOS/Linux   export GH_TOKEN=$(gh auth token)
    #   PowerShell    $env:GH_TOKEN = (gh auth token)
    environment:
      - GH_TOKEN
    command: sleep infinity
    networks: 
      - goiabada-network
    depends_on:
      db-tls:
        condition: service_completed_successfully

  # The test authority the three databases serve TLS from (#502), generated before any of them
  # starts into the db-tls volume, which each server and the devcontainer mount at /db-tls; the
  # data tier checks every server's certificate against /db-tls/ca.crt. generate-db-tls.sh keeps
  # a set that still verifies, so starting the stack again changes nothing. The postgres image
  # only because it carries bash and openssl and the stack pulls it anyway. The script alone is
  # mounted, not the checkout: Docker Desktop hands a second container binding the same host path
  # a shared copy of that bind, which would then be what the devcontainer reports mounting.
  db-tls:
    image: postgres:18
    entrypoint: ["bash", "/generate-db-tls.sh", "/db-tls"]
    volumes:
      - ./generate-db-tls.sh:/generate-db-tls.sh:ro
      - db-tls:/db-tls
    network_mode: none

  mysql-server:
    # The image the generated deployments run, which the setup wizard's
    # TestDevelopmentStacks_RunTheGeneratedDatabaseImages holds this to: a
    # major upgrade is one change to both, and a dump and restore of the
    # mysql-data volume, not a tag edit.
    image: mysql:26
    command: --port=13306 --ssl-ca=/db-tls/ca.crt --ssl-cert=/db-tls/server.crt --ssl-key=/db-tls/server.key
    volumes:
      - mysql-data:/var/lib/mysql
      - db-tls:/db-tls:ro
    depends_on:
      db-tls:
        condition: service_completed_successfully
    ports:
      - 13306:13306  # Devcontainer uses 13306 to avoid conflict with sample docker-compose files
    environment:
      MYSQL_ROOT_PASSWORD: mySqlPass123
    networks:
      - goiabada-network

  postgres-server:
    image: postgres:18
    # postgres.key, not server.key: PostgreSQL loads a key only when its own user owns it, mode 0600.
    command: -p 15432 -c ssl=on -c ssl_cert_file=/db-tls/server.crt -c ssl_key_file=/db-tls/postgres.key
    volumes:
      - postgres-data:/var/lib/postgresql
      - db-tls:/db-tls:ro
    depends_on:
      db-tls:
        condition: service_completed_successfully
    ports:
      - 15432:15432  # Devcontainer uses 15432 to avoid conflict with sample docker-compose files
    environment:
      POSTGRES_PASSWORD: myPostgresPass123
    networks:
      - goiabada-network

  mssql-server:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: Y
      MSSQL_SA_PASSWORD: YourStr0ngPassw0rd!  # Must be at least 8 characters including uppercase, lowercase, digits
      MSSQL_PID: Developer
      MSSQL_TCP_PORT: 11433
      # mssql-conf's network.tlscert and network.tlskey. The server refuses to start when either
      # file is missing, which db-tls rules out by running first.
      MSSQL_TLS_CERTIFICATE_FILE: /db-tls/server.crt
      MSSQL_TLS_KEY_FILE: /db-tls/server.key
    ports:
      - 11433:11433  # Devcontainer uses 11433 to avoid conflict with sample docker-compose files
    volumes:
      - mssql-data:/var/opt/mssql
      - db-tls:/db-tls:ro
    depends_on:
      db-tls:
        condition: service_completed_successfully
    networks:
      - goiabada-network
    deploy:
      resources:
        limits:
          memory: 4GB    # SQL Server requires at least 2GB of RAM, increased for stability

  mailpit:
    image: axllent/mailpit
    ports:
      - 8025:8025
    networks:
      - goiabada-network

volumes:
  mysql-data:
  postgres-data:
  mssql-data:
  db-tls:

networks:
  goiabada-network:
    driver: bridge