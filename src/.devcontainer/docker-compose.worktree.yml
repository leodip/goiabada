# Override for automated stacks: same services, no host-published ports.
#
# Apply it on top of docker-compose.yml, with a project name, to bring up an
# independent copy of the dev stack beside the one VS Code runs, one per git
# worktree. The four `ports:` entries in docker-compose.yml are the only thing
# that stops a second stack from starting: they exist for a person with a
# browser or a database client, not for the tests, which reach the databases
# by service name on the project's private network. Everything else (image,
# service names, internal ports, `command`, volumes) is inherited unchanged,
# so run-tests.sh works inside the second stack as it is, but for MySQL's data,
# below.
#
# `!reset` and `!override` need Compose 2.24 or later. Never apply this file to
# the human container: VS Code reads docker-compose.yml alone, and keeps its
# ports and its MySQL volume.
#
# The one port it adds is a pair on the devcontainer, for the auth server and
# admin console that `.placido/stack.sh serve` starts so an agent can look at
# the pages in a browser. No host port is named, so Docker picks a free one for
# each stack and two stacks never collide, and only on the loopback address.
#
# See README.md in this directory for how to start, wait for, use and tear
# down such a stack.
services:
  devcontainer:
    ports:
      - "127.0.0.1::19290"
      - "127.0.0.1::19291"
    # A ceiling on the memory of everything run in the devcontainer, swap
    # included, so a runaway test is killed here instead of starving the
    # machine. On #816 a mutation made a tokenizer loop while it allocated: the
    # test binary reached 42 GB of the host's 47 before the kernel killed it,
    # and the agents' terminals stopped answering on the way (2026-11-12).
    mem_limit: 16g
    memswap_limit: 16g
  mysql-server:
    ports: !reset []
    # MySQL keeps its data in memory here, not in the mysql-data volume. Every
    # schema change waits for a write to disk, and the data tier's migration
    # tests make thousands: a migration from empty took 8.8 seconds on the
    # volume and 1.3 in memory, and the MySQL data tier 12 to 18 minutes on the
    # volume and about 4 in memory (2026-11-11). The data are the tests', which
    # make their own, so losing them when the container stops costs nothing.
    volumes: !override
      - db-tls:/db-tls:ro
    tmpfs:
      - /var/lib/mysql
  postgres-server:
    ports: !reset []
  mssql-server:
    ports: !reset []
  mailpit:
    ports: !reset []
