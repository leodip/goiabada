services:

  mysql-server:
    # A major, the one latest named when this sample was written. A major upgrade is a dump and
    # restore, not a tag edit: MySQL upgrades a data directory in place only along its
    # documented paths, and does not start on one it cannot.
    image: mysql:26
    restart: unless-stopped    
    volumes:
      - mysql-data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: mySqlPass123
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-pmySqlPass123",  "--protocol", "tcp"]
      interval: 1s
      timeout: 2s
      retries: 20
    networks: 
      - goiabada-network  


  goiabada-authserver:
    # latest moves with every release: pin a release's version tag instead, such as
    # authserver-<version>, and change it when you upgrade.
    image: leodip/goiabada:authserver-latest
    restart: unless-stopped
    # Up to 50s to stop cleanly (15s to drain requests, 15s for work handed off after
    # responses, 20s for the cleanup worker) plus 10s of headroom; Compose's default is 10s.
    stop_grace_period: 60s
    # Runs as the image's own uid and gid, 10001, with every capability dropped, no privilege
    # gained through a setuid binary, and a read-only root.
    # /tmp is a tmpfs, where SQLite writes the temporary files of large sorts and VACUUM, and
    # where Go spills an upload larger than it keeps in memory.
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      mysql-server:
        condition: service_healthy
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      # The auth server writes the bootstrap file here: a named volume, which the image's
      # /bootstrap, owned by uid 10001, makes writable. A ./bootstrap bind mount would be
      # created owned by root, and the write refused.
      - bootstrap:/bootstrap
    # =============================================================================
    # BOOTSTRAP: On first startup, auth server seeds DB, generates credentials
    # in bootstrap.env on the bootstrap volume (OAuth client secret + session keys),
    # then EXITS. Read the file with:
    #   docker compose cp goiabada-authserver:/bootstrap/bootstrap.env .
    # Copy session keys from it, uncomment them below, and restart for normal operation.
    # =============================================================================
    networks:
      - goiabada-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:9090/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      # Up to 5 minutes for a first start to seed the database, or an upgrade to migrate it;
      # failures in that window do not count, and the first success ends it.
      start_period: 300s
    environment:
      # See all timezones:
      # https://en.wikipedia.org/wiki/List_of_tz_database_time_zones
      - TZ=Europe/Lisbon

      # The email address of the admin user (the first user created)
      - GOIABADA_ADMIN_EMAIL=admin@example.com

      # The password of the admin user (the first user created). There is no default:
      # set GOIABADA_ADMIN_PASSWORD in your shell, or in a .env file beside this file,
      # to at least 15 characters, and not changeme. Compose refuses to run until it is
      # set, and it must stay set for later commands too. Used only on the first start.
      - GOIABADA_ADMIN_PASSWORD=${GOIABADA_ADMIN_PASSWORD:?set GOIABADA_ADMIN_PASSWORD to the first administrator's password, at least 15 characters}

      # The name of your application or organization
      - GOIABADA_APPNAME=Goiabada

      # Without TLS (http) - do not use in production!
      - GOIABADA_AUTHSERVER_BASEURL=https://demo-authserver.example.com
      - GOIABADA_AUTHSERVER_INTERNALBASEURL=http://goiabada-authserver:9090
      - GOIABADA_AUTHSERVER_LISTEN_HOST_HTTPS=
      - GOIABADA_AUTHSERVER_LISTEN_PORT_HTTPS=
      - GOIABADA_AUTHSERVER_CERTFILE=
      - GOIABADA_AUTHSERVER_KEYFILE=
      - GOIABADA_AUTHSERVER_LISTEN_HOST_HTTP=0.0.0.0
      - GOIABADA_AUTHSERVER_LISTEN_PORT_HTTP=9090
      # The reverse proxy on this host, nginx or a Cloudflare Tunnel, appends the address it
      # received each connection from to X-Forwarded-For, so trusting one hop, the rightmost
      # entry, resolves the client with no list. Set the list only for a second proxy hop in
      # front of that one, naming every hop, this service's peer included: the Compose
      # network's gateway, not 127.0.0.1. For Cloudflare's proxy in front of nginx, have nginx
      # resolve Cloudflare instead: https://goiabada.dev/production-deployment/cloudflare-nginx/
      - GOIABADA_AUTHSERVER_TRUST_PROXY_HEADERS=true
      - GOIABADA_AUTHSERVER_TRUSTED_PROXIES=
      - GOIABADA_AUTHSERVER_LOG_HTTP_REQUESTS=true
      - GOIABADA_AUTHSERVER_LOG_LEVEL=info
      - GOIABADA_AUTHSERVER_LOG_FORMAT=text
      - GOIABADA_AUTHSERVER_LOG_SQL=false
      - GOIABADA_AUTHSERVER_STATICDIR= #leave this empty to use embedded static files
      - GOIABADA_AUTHSERVER_TEMPLATEDIR= #leave this empty to use embedded templates
      - GOIABADA_AUTHSERVER_DEBUG_API_REQUESTS=false # enable verbose API debug logs (auth server)
      # Write initial Admin Console OAuth credentials to this file during DB seed
      - GOIABADA_AUTHSERVER_BOOTSTRAP_ENV_OUTFILE=/bootstrap/bootstrap.env

      # Data-at-rest encryption key (auth server only). REQUIRED before first startup.
      # Generate your own with: openssl rand -hex 32
      - GOIABADA_AES_ENCRYPTION_KEY=00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff

      # UNCOMMENT AND FILL IN AFTER FIRST STARTUP:
      # - GOIABADA_AUTHSERVER_SESSION_AUTHENTICATION_KEY=<copy from bootstrap.env>
      # - GOIABADA_AUTHSERVER_SESSION_ENCRYPTION_KEY=<copy from bootstrap.env>

      # Database (mysql) details
      - GOIABADA_DB_TYPE=mysql
      - GOIABADA_DB_USERNAME=root
      - GOIABADA_DB_PASSWORD=mySqlPass123
      - GOIABADA_DB_HOST=mysql-server
      - GOIABADA_DB_PORT=3306
      - GOIABADA_DB_NAME=goiabada

      # The auth server needs to know the base URLs of the admin console
      - GOIABADA_ADMINCONSOLE_BASEURL=https://demo-adminconsole.example.com


  goiabada-adminconsole:
    # latest moves with every release: pin a release's version tag instead, such as
    # adminconsole-<version>, and change it when you upgrade.
    image: leodip/goiabada:adminconsole-latest
    restart: unless-stopped
    # The auth server's value: this service stops within its 15s drain, and a grace
    # period is a ceiling, not a wait. Compose's default is 10s.
    stop_grace_period: 60s
    # Runs as the image's own uid and gid, 10001, with every capability dropped, no privilege
    # gained through a setuid binary, and a read-only root.
    # /tmp is a tmpfs, where Go spills an upload larger than it keeps in memory.
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      goiabada-authserver:
        condition: service_healthy
    ports:
      - "127.0.0.1:9091:9091"
    networks:
      - goiabada-network
    # =============================================================================
    # FIRST-TIME SETUP: Run `docker compose up`, wait for auth server to exit,
    # then copy all credentials from bootstrap.env (read it with the
    # `docker compose cp` command above) and uncomment
    # the 3 lines below. Restart to complete setup.
    # =============================================================================
    environment:
      # UNCOMMENT AND FILL IN AFTER FIRST STARTUP:
      # - GOIABADA_ADMINCONSOLE_OAUTH_CLIENT_SECRET=<copy from bootstrap.env>
      # - GOIABADA_ADMINCONSOLE_SESSION_AUTHENTICATION_KEY=<copy from bootstrap.env>
      # - GOIABADA_ADMINCONSOLE_SESSION_ENCRYPTION_KEY=<copy from bootstrap.env>
      # See all timezones:
      # https://en.wikipedia.org/wiki/List_of_tz_database_time_zones
      - TZ=Europe/Lisbon

      # Without TLS (http) - do not use in production!
      - GOIABADA_ADMINCONSOLE_BASEURL=https://demo-adminconsole.example.com
      - GOIABADA_ADMINCONSOLE_LISTEN_HOST_HTTPS=
      - GOIABADA_ADMINCONSOLE_LISTEN_PORT_HTTPS=
      - GOIABADA_ADMINCONSOLE_CERTFILE=
      - GOIABADA_ADMINCONSOLE_KEYFILE=
      - GOIABADA_ADMINCONSOLE_LISTEN_HOST_HTTP=0.0.0.0
      - GOIABADA_ADMINCONSOLE_LISTEN_PORT_HTTP=9091
      # The reverse proxy on this host, nginx or a Cloudflare Tunnel, appends the address it
      # received each connection from to X-Forwarded-For, so trusting one hop, the rightmost
      # entry, resolves the client with no list. Set the list only for a second proxy hop in
      # front of that one, naming every hop, this service's peer included: the Compose
      # network's gateway, not 127.0.0.1. For Cloudflare's proxy in front of nginx, have nginx
      # resolve Cloudflare instead: https://goiabada.dev/production-deployment/cloudflare-nginx/
      - GOIABADA_ADMINCONSOLE_TRUST_PROXY_HEADERS=true
      - GOIABADA_ADMINCONSOLE_TRUSTED_PROXIES=
      - GOIABADA_ADMINCONSOLE_LOG_HTTP_REQUESTS=true
      - GOIABADA_ADMINCONSOLE_LOG_LEVEL=info
      - GOIABADA_ADMINCONSOLE_LOG_FORMAT=text
      - GOIABADA_ADMINCONSOLE_STATICDIR= #leave this empty to use embedded static files
      - GOIABADA_ADMINCONSOLE_TEMPLATEDIR= #leave this empty to use embedded templates

      # The admin console needs to know the base URLs of the auth server
      - GOIABADA_AUTHSERVER_BASEURL=https://demo-authserver.example.com
      - GOIABADA_AUTHSERVER_INTERNALBASEURL=http://goiabada-authserver:9090

volumes:
  mysql-data:
  bootstrap:

networks:
  goiabada-network:
