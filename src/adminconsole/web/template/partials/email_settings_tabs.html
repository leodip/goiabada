{{define "email_settings_tabs"}}
{{- $type := index . 0 }}
{{- $ctx := index . 1 }}
<nav class="tab-bar" aria-label="{{ T $ctx "adminconsole.tabs.label" }}">
  <a class="tab-item" href="/admin/settings/email"{{ if eq $type "configuration" }} aria-current="page"{{ end }}>{{ T $ctx "adminconsole.email_tabs.configuration" }}</a>
  <a class="tab-item" href="/admin/settings/email/send-test-email"{{ if eq $type "send-test-email" }} aria-current="page"{{ end }}>{{ T $ctx "adminconsole.email_tabs.send_test" }}</a>
</nav>
{{end}}
