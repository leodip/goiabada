# This config covers only the interfaces core itself owns. Several other mocks that
# live under core/ (oauth, user, validators, communication, otp) are generated by
# authserver/.mockery.yaml from authserver's own declarations. Core's middleware owns
# and generates both of its narrow mocks here, AuthHelper and tokenParser; core/validators
# still reuses authserver-generated mocks for interfaces such as TokenParser and
# PermissionChecker, and #344 relocates that file to the auth server, where its mock
# regenerates anyway.
filename: "{{.InterfaceName | snakecase}}_mock.go"
structname: "{{.InterfaceName}}"
template: testify
# Emits "//go:build !production" in every generated mock, keeping testify out of
# production builds (see build/Dockerfile-*, which build with -tags=production).
#
# boilerplate-file names the same file authserver/.mockery.yaml does, spelled
# relative to this module because the path resolves against mockery's working
# directory. See that file for what it is for (#338).
template-data:
  mock-build-tags: "!production"
  boilerplate-file: "../mockery-header.txt"
packages:
  # Database interface
  github.com/leodip/goiabada/core/data:
    interfaces:
      Database:
        config:
          dir: "./data/mocks"
          pkgname: "mocks_data"
  # Session store
  github.com/leodip/goiabada/core/sessionstore:
    interfaces:
      Store:
        config:
          dir: "./sessionstore/mocks"
          pkgname: "mocks_sessionstore"
  # JWT middleware
  github.com/leodip/goiabada/core/middleware:
    interfaces:
      AuthHelper:
        config:
          dir: "./middleware/mocks"
          pkgname: "mocks_middleware"
      # Unexported, so the global structname template would emit an unusable
      # lowercase type name outside the generated package. Name it explicitly (#338).
      tokenParser:
        config:
          dir: "./middleware/mocks"
          pkgname: "mocks_middleware"
          structname: "TokenParser"
