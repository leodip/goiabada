# This config covers only the interfaces core itself owns. Several other mocks that
# live under core/ (handlerhelpers, oauth, user, validators, communication, otp) are
# generated by authserver/.mockery.yaml from authserver's own, wider declarations.
# core's tests reuse them: core declares narrower versions of AuthHelper, TokenParser
# and PermissionChecker (1 method each), which the wider authserver mocks satisfy.
# So narrowing or removing one of those interfaces in authserver can break core's
# tests. It fails at compile time, not silently.
filename: "{{.InterfaceName | snakecase}}_mock.go"
structname: "{{.InterfaceName}}"
template: testify
# Emits "//go:build !production" in every generated mock, keeping testify out of
# production builds (see build/Dockerfile-*, which build with -tags=production).
template-data:
  mock-build-tags: "!production"
packages:
  # Database interface
  github.com/leodip/goiabada/core/data:
    interfaces:
      Database:
        config:
          dir: "./data/mocks"
          pkgname: "mocks_data"
  # Session store
  github.com/gorilla/sessions:
    interfaces:
      Store:
        config:
          dir: "./sessionstore/mocks"
          pkgname: "mocks_sessionstore"
