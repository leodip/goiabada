"adminconsole.admin_settings.general.field.password_policy" = "Zasady haseł"
"adminconsole.admin_settings.general.password_policy_tooltip" = "Obowiązują przy każdym ustawieniu lub zmianie hasła. Już ustawione hasła nie są sprawdzane ponownie."
# The nist policy's card, first among the five, and the line each older card gains (#550 decision 3).
"adminconsole.admin_settings.general.password_policy_nist" = "NIST SP 800-63B"
"adminconsole.admin_settings.general.password_policy_nist_hint" = "Co najmniej 15 znaków, dowolnych. Odrzucane jest często używane hasło, a także adres e-mail konta, nazwa użytkownika lub nazwa aplikacji albo ich prosta odmiana."
"adminconsole.admin_settings.general.password_policy_nist_why" = "Zalecane. Zgodne z wytycznymi amerykańskiego National Institute of Standards and Technology dla hasła, które może być jedynym, co sprawdza logowanie: liczy się długość i porównanie z hasłami, które atakujący próbują najpierw, a nie wymagane rodzaje znaków, które utrudniają zapamiętanie hasła, nie utrudniając jego odgadnięcia."
"adminconsole.admin_settings.general.password_policy_short_of_nist" = "Nie spełnia NIST SP 800-63B."
"adminconsole.admin_settings.general.password_policy_none" = "Bez zasad"
"adminconsole.admin_settings.general.password_policy_none_hint" = "Co najmniej 1 znak."
"adminconsole.admin_settings.general.password_policy_low" = "Niskie"
"adminconsole.admin_settings.general.password_policy_low_hint" = "Co najmniej 6 znaków."
"adminconsole.admin_settings.general.password_policy_medium" = "Średnie"
"adminconsole.admin_settings.general.password_policy_medium_hint" = "Co najmniej 8 znaków, w tym mała litera, wielka litera i cyfra."
"adminconsole.admin_settings.general.password_policy_high" = "Wysokie"
"adminconsole.admin_settings.general.password_policy_high_hint" = "Co najmniej 10 znaków, w tym mała litera, wielka litera, cyfra i symbol."
"adminconsole.admin_settings.general.section_registration" = "Rejestracja"
"adminconsole.admin_settings.general.field.self_registration_enabled" = "Rejestracja użytkowników"
"adminconsole.admin_settings.general.self_registration_enabled_tooltip" = "Strona logowania oferuje „Utwórz konto”, więc każdy może się zarejestrować sam. Gdy jest wyłączona, użytkowników tworzą tylko administratorzy."
"adminconsole.admin_settings.general.field.self_registration_email_verification" = "Wymagaj weryfikacji adresu e-mail"
"adminconsole.admin_settings.general.self_registration_email_verification_tooltip" = "Nowe konto jest aktywowane linkiem wysłanym na jego adres e-mail. Wymaga to skonfigurowanej poczty e-mail."
"adminconsole.admin_settings.general.self_registration_email_warning" = "Poczta e-mail nie jest skonfigurowana, więc nikt nie może się zarejestrować: skonfiguruj ją albo przestań wymagać weryfikacji adresu e-mail."
"adminconsole.admin_settings.general.email_settings_link" = "Ustawienia poczty e-mail"
"adminconsole.admin_settings.general.field.dynamic_client_registration" = "Dynamiczna rejestracja clientów"
"adminconsole.admin_settings.general.dynamic_client_registration_tooltip" = "Clienty mogą rejestrować się same pod adresem /connect/register (RFC 7591), co dokument discovery wtedy ogłasza. Przydatne dla MCP i innych integracji, które rejestrują się podczas działania."
"adminconsole.admin_settings.general.section_account_deletion" = "Usuwanie konta"
"adminconsole.admin_settings.general.field.account_deletion_enabled" = "Pozwól użytkownikom usuwać własne konto"
"adminconsole.admin_settings.general.account_deletion_enabled_tooltip" = "Użytkownicy usuwają konto na stronach swojego konta, podając hasło, a gdy uwierzytelnianie dwuskładnikowe jest włączone, także kod. Ty możesz usunąć każdego użytkownika niezależnie od tego ustawienia."
"adminconsole.admin_settings.general.section_flows" = "Przepływy OAuth"
"adminconsole.admin_settings.general.flows_lead" = "Każdy client dostaje te ustawienia, chyba że jego karta Przepływy OAuth2 mówi inaczej."
"adminconsole.admin_settings.general.field.pkce_required" = "Wymagaj PKCE"
"adminconsole.admin_settings.general.pkce_required_tooltip" = "Poufne clienty korzystające z przepływu authorization code muszą wysyłać PKCE, jak zaleca OAuth 2.1. Clienty publiczne muszą zawsze."
"adminconsole.admin_settings.general.pkce_warning" = "Bez PKCE przechwycony kod autoryzacji może wykorzystać ktoś inny. Ustaw PKCE jako opcjonalne tylko dla oprogramowania, które nie potrafi go wysłać."
"adminconsole.admin_settings.general.field.implicit_flow_enabled" = "Przepływ implicit"
"adminconsole.admin_settings.general.implicit_flow_tooltip" = "Zwraca tokeny bezpośrednio z endpointu autoryzacji (RFC 6749, sekcja 4.2). Wycofany w OAuth 2.1."
"adminconsole.admin_settings.general.implicit_flow_warning" = "Przepływ implicit umieszcza tokeny w adresach URL, gdzie mogą je zachować historia przeglądarki i logi, i nie wydaje refresh tokenów. Wszędzie, gdzie to możliwe, używaj przepływu authorization code z PKCE."
"adminconsole.admin_settings.general.field.ropc_flow_enabled" = "Resource Owner Password Credentials (ROPC)"
"adminconsole.admin_settings.general.ropc_flow_tooltip" = "Client sam wysyła nazwę użytkownika i hasło, aby uzyskać tokeny (RFC 6749, sekcja 4.3). Wycofany w OAuth 2.1."
"adminconsole.admin_settings.general.ropc_flow_warning" = "Client widzi hasło użytkownika, z pominięciem strony logowania serwera uwierzytelniania, a użytkownicy z uwierzytelnianiem dwuskładnikowym nie mogą korzystać z tego przepływu. Wszędzie, gdzie to możliwe, używaj przepływu authorization code z PKCE."

