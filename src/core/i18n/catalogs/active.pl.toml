"adminconsole.admin_users.connected_clients.intro" = "Clienty, którym ten użytkownik udzielił zgody lub z którymi ma refresh token, oraz scope'y każdego z nich. Odłączenie clienta usuwa każdą zgodę udzieloną mu przez użytkownika i unieważnia dostęp, który ma w imieniu użytkownika na każdym urządzeniu, łącznie z refresh tokenami offline, choć niektóre już wydane access tokeny mogą działać do czasu ich wygaśnięcia. Serwer uwierzytelniania próbuje przekazać mu, aby wylogował użytkownika. Użytkownik pozostaje zalogowany, a client może poprosić go o ponowne zalogowanie."
