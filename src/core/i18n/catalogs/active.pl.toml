# Goiabada Polish message catalog (pl).
#
# Register: the informal second person (ty) for buttons and instructions, present and imperative
# (Zaloguj się, Wpisz kod, Zapisz); impersonal forms for what happened (Wylogowano., Zapisano
# zmiany., Zalogowano jako…). Nothing agrees with the reader's gender: no second-person past tense,
# no participle or adjective said of the reader, and a question is reworded rather than gendered
# (Czy na pewno chcesz…?). Pages write ty, twój and ci in lower case; emails capitalise them.
# Glossary: zaloguj się / wyloguj się; logowanie / wylogowanie (nouns); client for administrators
# and aplikacja for the person signing in; kod jednorazowy; uwierzytelnianie dwuskładnikowe; serwer
# uwierzytelniania; adres e-mail; konsola administracyjna; kod odzyskiwania; aplikacja
# uwierzytelniająca; zgoda; uprawnienie; sesja; grupa; zasób; atrybut; marka; dziennik audytu;
# dokument prawny; szablon wiadomości e-mail; hasło; konto.
# Keep token, access token, refresh token, ID token, scope, claim, issuer, client, client secret and
# redirect URI in English, alongside protocol names and identifiers, declined the usual Polish way
# where a sentence needs it (tokenu, scope'u, clienta).
# Typography: no space before : ; ? !; „quoted interface labels”.
# Numeric dates: day.month.year, 24-hour clock. Relative times are whole phrases.
# Counted values have four forms, one, few, many and other, chosen by CLDR's plural rules: 1 minutę,
# 2 minuty, 5 minut, 22 minuty; other, which only a fraction reaches, takes the genitive singular.
# A limit is worded so its number needs no agreeing noun (Maksymalna liczba znaków: {{.max}}.),
# except after a preposition that fixes the noun for every count above 1 (do {{.max}} sekund).
# The emails' {{expiry}} writes its unit in the accusative (za 5 minut, przez 24 godziny), the case
# their expiry sentences take. The console's durations come from the browser in the nominative
# (1 minuta), so a sentence that embeds one puts it after a colon.
# Keep Go {{.name}} and JavaScript {{name}} placeholders exactly as in English.

