# Goiabada Russian message catalog (ru).
#
# Register: вы, in lower case (вы, ваш, вам), on every page and in every email. Buttons, links and
# menu items take the infinitive or a noun (Войти, Сохранить, Отмена); instructions take the
# imperative of вы (Введите код.); what happened is impersonal or passive (Выход выполнен.,
# Изменения сохранены.).
# Spelling: е, never ё (еще, истек, включен), in every value; a test refuses ё here. A sentence
# where все could be read as всё is reworded.
# Glossary: войти / выйти; вход / выход (nouns); аккаунт; адрес электронной почты, электронная
# почта as a field's label, письмо for a message; client where an administrator reads and
# приложение for the person signing in; одноразовый код; двухфакторная аутентификация; сервер
# аутентификации; консоль администратора; код восстановления; приложение-аутентификатор; согласие;
# разрешение; ресурс; сеанс; группа; атрибут; бренд; журнал аудита; юридический документ; шаблон
# письма; ключ подписи; пароль; пользователь; настройки.
# Keep token, access token, refresh token, ID token, scope, claim, issuer, client, client secret,
# redirect URI and endpoint in English, with the flow names (authorization code, client
# credentials, implicit flow, back-channel logout) and protocol names and identifiers (OAuth,
# OpenID Connect, PKCE, DPoP, UserInfo, offline_access, client_id), in Latin script and never
# declined: a label uses the English plural where it names several (Clients, Redirect URIs), and a
# sentence is worded so the term needs no ending, with a Russian noun before it where a case must
# show (параметр scope, Количество client с этим брендом: {{.count}}).
# Typography: «quoted interface labels»; a dash with spaces ( — ); no space before : ; ? !.
# Numeric dates: day.month.year, 24-hour clock. Relative times are whole phrases.
# Counted values have four forms, one, few, many and other, chosen by CLDR's plural rules: 1 минуту,
# 2 минуты, 5 минут, 11 минут, 21 минуту; other, which only a fraction reaches, takes the genitive
# singular. Every form writes its count, since one also covers 21 and 31.
# A limit is worded so its number needs no agreeing noun (Максимальное количество символов: {{.max}}.).
# The emails' {{expiry}} writes its unit in the accusative (через 5 минут, действует 24 часа), the
# case their expiry sentences take; they never say в течение, which needs the genitive. The
# console's durations come from the browser in the nominative (1 минута 30 секунд), so a sentence
# that embeds one puts it after a colon.
# Keep Go {{.name}} and JavaScript {{name}} placeholders exactly as in English.

