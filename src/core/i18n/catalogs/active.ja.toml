"adminconsole.admin_users.connected_clients.intro" = "このユーザーが同意した client、またはこのユーザーが refresh token を持っている client と、それぞれの scope です。接続を解除すると、ユーザーがその client に与えた同意が削除され、offline refresh token を含め、すべてのデバイスでその client がユーザーについて保持しているアクセスが取り消されます。ただし、すでに発行された access token の一部は、有効期限まで引き続き使用できる場合があります。認証サーバーはその client にユーザーをログアウトさせるよう通知を試みます。ユーザーはログインしたままで、client はユーザーに再度ログインを求めることができます。"
