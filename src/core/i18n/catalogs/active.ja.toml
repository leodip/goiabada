"adminconsole.admin_settings.general.implicit_flow_warning" = "implicit flow は token を URL に含めるため、ブラウザーの履歴やログに残るおそれがあり、refresh token も発行されません。可能な限り、PKCE を使った authorization code フローを使用してください。"
