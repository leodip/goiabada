# Goiabada Japanese message catalog (ja).
#
# Register: です・ます in sentences, on every page and in every email (〜してください, 〜しました,
# 〜できます). Buttons, links, tabs, menu entries and titles are noun phrases (保存, キャンセル, 削除,
# 続行, 戻る, ログイン, メールテンプレートを編集). The long-vowel mark is kept (サーバー, ユーザー).
# Glossary: ログイン and ログアウト (verbs with する, and the nouns: ログインページ, ログイン試行);
# アカウント; メールアドレス, and メール for a message; パスワード; ユーザー; アプリケーション for the
# client where the person signing in reads; ワンタイムコード (the authenticator's one-time code);
# 確認コード (the verification code sent by email); 二要素認証; 認証サーバー; 管理コンソール;
# リカバリーコード; 認証アプリ (the set phrase, and the one place アプリ is written); セッション; 同意;
# 権限; リソース; グループ; 属性; ブランド; 監査ログ; 法的文書; メールテンプレート; 署名鍵; 設定. The
# name fields are 名 (given name), ミドルネーム (middle name) and 姓 (family name), and a form asks for
# 姓 first: common.name_order is family_first, so it draws 姓, 名, ミドルネーム.
# Keep token, access token, refresh token, ID token, scope, claim, issuer, client, client secret,
# redirect URI and endpoint in English, with the flow names (authorization code, client
# credentials, implicit flow, back-channel logout) and protocol names and identifiers (OAuth,
# OpenID Connect, PKCE, DPoP, UserInfo, offline_access, client_id), in Latin script as the
# specifications write them, never in katakana: a label uses the English plural where it names
# several (Clients, Redirect URIs), and a sentence writes the singular with a Japanese particle
# after it and, where it helps, a Japanese noun beside it (scope パラメーター, client の設定). The
# person signing in reads アプリケーション, never client.
# Typography: full-width punctuation with no space around it (、。「」：？！（）), 「」 around quoted
# interface labels. A half-width space stands at every boundary between half-width text and
# Japanese: a number, a Latin-script word or a placeholder has one space between it and the
# Japanese beside it (3 日前, {{.max}} 文字以内, この client を削除しますか？), and none between it and a
# punctuation mark. The console's durations, which the browser writes ("1 時間 30 分"), and the
# emails' {{expiry}} ("30 分") follow the same rule.
# Numeric dates: year/month/day, 24-hour clock (2006/01/02 15:04). Relative times are whole phrases
# ("{{.count}} 日前").
# Counted values have one form, other, the only CLDR plural category Japanese has.
# Keep Go {{.name}} and JavaScript {{name}} placeholders exactly as in English.

