"adminconsole.admin_settings.general.field.pkce_required" = "PKCE を必須にする"
"adminconsole.admin_settings.general.pkce_required_tooltip" = "OAuth 2.1 の推奨どおり、authorization code フローを使うコンフィデンシャル client は PKCE を送信する必要があります。パブリック client は常に必須です。"
"adminconsole.admin_settings.general.pkce_warning" = "PKCE がないと、傍受された authorization code を第三者が使用できてしまいます。PKCE を送信できないソフトウェアの場合にのみ任意にしてください。"
