"adminconsole.admin_settings.general.password_policy_nist" = "NIST SP 800-63B"
"adminconsole.admin_settings.general.password_policy_nist_hint" = "15 文字以上で、使える文字に制限はありません。よく使われるパスワード、アカウントのメールアドレス、ユーザー名、アプリケーション名、およびそれらを少し変えただけのものは使用できません。"
