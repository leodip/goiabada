"adminconsole.admin_settings.general.account_deletion_enabled_tooltip" = "ユーザーはアカウントページから、パスワードと、二要素認証が有効な場合はコードを入力して、自分のアカウントを削除します。どちらの設定でも、管理者はどのユーザーでも削除できます。"
"adminconsole.admin_settings.general.section_flows" = "OAuth フロー"
