# --- OAuth/internal error page (auth_error.html) ----------------------------

"auth_error.page_title" = "Error"
"auth_error.ceremony_mismatch.title" = "This request is no longer active"
"auth_error.ceremony_mismatch.message" = "This page belongs to a sign-in that can no longer continue. It may have finished already, or a later sign-in or sign-out in this browser ended it. Go back to the application you were signing in to and start again."
"auth_error.state_mismatch.title" = "This step is no longer available"
"auth_error.state_mismatch.message" = "This page belongs to a step of the sign-in you have already moved past, so it can no longer be used. Going back in the browser reaches a page the server has finished with. Go back to the application you were signing in to and start again."
# An enrolment at /auth/otp that lost to another change of the account's authenticator ends the
# sign-in here: nothing was stored, so it has no second factor to continue with (#471).
"auth_error.otp_changed.title" = "Your two-factor authentication settings changed"
"auth_error.otp_changed.message" = "The two-factor authentication settings of this account changed while you were signing in, so this sign-in cannot continue. Go back to the application you were signing in to and sign in again."
"auth_error.rate_limited.title" = "Too many attempts"
"auth_error.rate_limited.message" = "Too many requests have come from this browser, or for this account, in a short time. Please wait a few minutes and try again."
"auth_error.unable_to_authorize.title" = "Unable to authorize"
# Wording kept byte for byte from the error_description this condition used to redirect, so an
# integrator meets the same sentence now that it is answered on a page instead (#213).
"auth_error.unsupported_response_mode.message" = "Invalid response_mode parameter. Supported values are: query, fragment, form_post."
# form_post with a redirect URI no form can post to, answered on the page for the reason the line above is (#121).
"auth_error.form_post_unreachable.code.message" = "response_mode=form_post posts the response to the redirect URI as a form, which no scheme other than http or https can receive. Use response_mode=query or response_mode=fragment instead."
"auth_error.form_post_unreachable.implicit.message" = "response_mode=form_post posts the response to the redirect URI as a form, which no scheme other than http or https can receive. Use response_mode=fragment instead."
# The two below are answered on the page because the request cannot say where a redirect would go (#228).
"auth_error.malformed_request.message" = "The authorization request could not be read: one of its parameters is not correctly encoded."
"auth_error.repeated_parameter.message" = "The {{.parameter}} parameter was included more than once."
# A POST to the authorization endpoint is parked and answered with a redirect that carries a
# one-time handle (#246). The page says the same whether the handle expired, was used already, never
# existed or arrived beside other parameters, so it reveals nothing about which.
"auth_error.request_handle_unusable.message" = "This sign-in link is no longer valid. It may have expired, it may have been used already, or it may have been changed. Go back to the application you were signing in to and start again."

