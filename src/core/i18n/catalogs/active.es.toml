# Goiabada Spanish message catalog (es).
#
# Neutral Spanish; address the reader as tú throughout.
# Sign in/out: iniciar/cerrar sesión; sign-in: inicio de sesión.
# Client: cliente for administrators, aplicación for end users.
# One-time code: código de un solo uso; two-factor authentication: autenticación de dos factores.
# Auth server: servidor de autenticación; email: correo electrónico.
# Technical terms used naturally in the admin UI: token, refresh token, ID token, scope, claim,
# subject, endpoint, backend, host, loopback and CORS preflight.
# Dates: day first, 24-hour clock. Relative times are complete phrases.
# Format: simple "key" = "value". Values are plain strings; {{.name}}
# placeholders render with Go text/template. A [table] is refused at startup.

