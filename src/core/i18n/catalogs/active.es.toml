"auth_error.unable_to_authorize.title" = "No se pudo autorizar"
# Wording kept byte for byte from the error_description this condition used to redirect, so an
# integrator meets the same sentence now that it is answered on a page instead (#213).
"auth_error.unsupported_response_mode.message" = "El parámetro response_mode no es válido. Los valores admitidos son: query, fragment, form_post."
# form_post with a redirect URI no form can post to, answered on the page for the reason the line above is (#121).
"auth_error.form_post_unreachable.code.message" = "response_mode=form_post envía la respuesta a la URI de redirección como un formulario, que solo puede recibir una dirección http o https. Usa response_mode=query o response_mode=fragment."
"auth_error.form_post_unreachable.implicit.message" = "response_mode=form_post envía la respuesta a la URI de redirección como un formulario, que solo puede recibir una dirección http o https. Usa response_mode=fragment."
# The two below are answered on the page because the request cannot say where a redirect would go (#228).
"auth_error.malformed_request.message" = "No se pudo leer la solicitud de autorización: uno de sus parámetros no está codificado correctamente."
"auth_error.repeated_parameter.message" = "El parámetro {{.parameter}} se incluyó más de una vez."
# A POST to the authorization endpoint is parked and answered with a redirect that carries a
# one-time handle (#246). The page says the same whether the handle expired, was used already, never
