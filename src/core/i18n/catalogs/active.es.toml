# --- Authorize endpoint, client and redirect_uri (LocalizedError-backed) -----
#
# These seven render the refusal page at /auth/authorize and never become an
# error_description, which is why they are localized while the authorize
# validations that run after them are not. Their usual reader is the integrator
# who registered the client, so each keeps the specific diagnosis: which of the
# seven conditions failed is the whole value of the message.

