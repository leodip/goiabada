"adminconsole.admin_settings.tokens.include_oidc_in_id_token_tooltip" = "Quando habilitado, claims baseadas em escopo (email, profile, address, phone...) são incluídas diretamente nos ID tokens. Quando desabilitado, essas claims só estão disponíveis pelo endpoint /userinfo, o que é exigido para testes estritos de conformidade OIDC. A maioria dos servidores OIDC em produção inclui claims por padrão para melhor experiência do desenvolvedor."

