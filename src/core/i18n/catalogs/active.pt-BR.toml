"adminconsole.admin_settings.general.password_policy_high" = "Força alta - ao menos 10 caracteres (deve conter 1 maiúscula, 1 minúscula, 1 número e 1 caractere especial/símbolo)"
"adminconsole.admin_settings.general.field.self_registration_enabled" = "Cadastro próprio de usuário habilitado"
"adminconsole.admin_settings.general.self_registration_enabled_tooltip" = "Se habilitado, um link de 'cadastro' será exibido na tela de login. Se desabilitado, apenas administradores podem criar usuários."
"adminconsole.admin_settings.general.field.self_registration_email_verification" = "Cadastro próprio exige verificação de e-mail"
"adminconsole.admin_settings.general.self_registration_email_verification_tooltip" = "Se habilitado, usuários cadastrados pelo próprio usuário ativam a conta por meio de um link de confirmação enviado ao e-mail. Isso exige o e-mail configurado em E-mail - SMTP: enquanto não estiver, o cadastro fica indisponível. Se desabilitado, as contas são criadas na hora, sem confirmação por e-mail."
"adminconsole.admin_settings.general.self_registration_email_warning" = "O e-mail não está configurado, então o cadastro está indisponível. Configure-o em E-mail - SMTP ou desabilite a verificação de e-mail."
"adminconsole.admin_settings.general.field.dynamic_client_registration" = "Cadastro dinâmico de clientes habilitado"
"adminconsole.admin_settings.general.dynamic_client_registration_tooltip" = "RFC 7591 - Permite que clientes OAuth se cadastrem automaticamente via endpoint /connect/register. Quando habilitado, o endpoint de cadastro é anunciado nos metadados .well-known/openid-configuration. Útil para MCP (Model Context Protocol) e outras integrações dinâmicas."
"adminconsole.admin_settings.general.field.pkce_required" = "PKCE obrigatório para clientes confidenciais no fluxo authorization code"
"adminconsole.admin_settings.general.pkce_required_tooltip" = "Quando habilitado, os clientes confidenciais que usam o fluxo authorization code devem usar PKCE (Proof Key for Code Exchange). Esta é uma boa prática de segurança recomendada pelo OAuth 2.1. Clientes confidenciais individuais podem sobrescrever esta configuração."
"adminconsole.admin_settings.general.pkce_warning" = "Atenção: desabilitar o PKCE reduz a segurança. O PKCE protege contra ataques de interceptação de authorization code. Desabilite isto apenas se houver clientes confidenciais legados que não suportem PKCE."
"adminconsole.admin_settings.general.field.implicit_flow_enabled" = "Fluxo implicit habilitado"
"adminconsole.admin_settings.general.implicit_flow_tooltip" = "RFC 6749 Seção 4.2 - Habilita o grant implicit do OAuth 2.0. Permite que clientes recebam access tokens diretamente do endpoint de autorização. Clientes individuais podem sobrescrever esta configuração."
"adminconsole.admin_settings.general.implicit_flow_warning" = "Atenção: o fluxo implicit está depreciado no OAuth 2.1 e tem vulnerabilidades de segurança conhecidas. Tokens são expostos em URLs e no histórico do navegador. Use o fluxo authorization code com PKCE sempre que possível. Habilite isto apenas para clientes legados que não suportam o fluxo authorization code."
"adminconsole.admin_settings.general.field.ropc_flow_enabled" = "Fluxo resource owner password credentials habilitado"
"adminconsole.admin_settings.general.ropc_flow_tooltip" = "RFC 6749 Seção 4.3 - Habilita o grant resource owner password credentials do OAuth 2.0. Permite que clientes troquem credenciais do usuário diretamente por tokens. Clientes individuais podem sobrescrever esta configuração."
"adminconsole.admin_settings.general.ropc_flow_warning" = "Atenção: o fluxo resource owner password credentials está depreciado no OAuth 2.1 e expõe credenciais do usuário diretamente aos clientes. Habilite isto apenas para clientes próprios altamente confiáveis ou cenários de migração legada. Use o fluxo authorization code com PKCE sempre que possível. Observação: usuários com 2FA habilitado não podem usar este fluxo."

