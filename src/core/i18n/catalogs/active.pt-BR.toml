#
# O layout é um layout de referência do Go, traduzível porque o Go formata os
# nomes de mês em inglês em qualquer idioma. Traduza a ordem dos campos e o
# relógio (12 ou 24 horas); mantenha os números de referência exatamente —
# 01 mês, 02 dia, 2006 ano, 03 ou 15 hora, 04 minuto — ou nenhuma data será
# formatada. Cada valor "since" carrega a frase inteira, então a contagem fica
# onde o idioma a coloca.
