# Goiabada French catalog (fr), shared across French-speaking regions.
# Address readers as vous. Sentence case; actions use the infinitive.
# Glossary: se connecter / se déconnecter; connexion; client for administrators,
# application for account holders; code à usage unique; authentification à deux
# facteurs; serveur d’authentification; adresse e-mail; jeton d’accès / d’identité /
# de rafraîchissement. Keep OAuth scope and claim, protocol names and identifiers.
# Typography: U+00A0 NO-BREAK SPACE before : ; ? ! and inside « » in prose,
# including email bodies. Keep URLs, protocol syntax and template placeholders intact.
# Go date layout: day/month/year, 24-hour clock. Relative times are full phrases.
# Terms checked against Keycloak’s French login catalog (themes/src/main/resources-community/
# theme/base/login/messages/messages_fr.properties); wording here follows Goiabada’s context.
# Regional wording can be customized through operator override catalogs.
# Native-speaker review is required before release (#659).

