"auth_error.form_post_unreachable.code.message" = "response_mode=form_post invia la risposta all'URI di reindirizzamento tramite un modulo, che può essere ricevuto solo con gli schemi http o https. Usa invece response_mode=query o response_mode=fragment."
"auth_error.form_post_unreachable.implicit.message" = "response_mode=form_post invia la risposta all'URI di reindirizzamento tramite un modulo, che può essere ricevuto solo con gli schemi http o https. Usa invece response_mode=fragment."
# The two below are answered on the page because the request cannot say where a redirect would go (#228).
"auth_error.malformed_request.message" = "Non è stato possibile leggere la richiesta di autorizzazione: uno dei parametri non è codificato correttamente."
