# Goiabada Italian message catalog (it).
#
# Register: tu throughout pages, refusals and emails. Sentence case; imperative
# buttons (Accedi, Esci, Salva). Everyday Italian shared by Italy and Switzerland.
# Glossary: accedere / uscire; accesso (noun); client for administrators and
# applicazione for the person signing in; codice monouso; autenticazione a due
# fattori; server di autenticazione; permesso; criteri delle password.
# Keep password, email, account, client, client secret, token, ID token,
# refresh token, scope, claim and issuer, alongside protocol identifiers.
# Typography: ordinary Italian punctuation spacing (no space before : ; ? !),
# apostrophes for elision and accents on vowels; «quoted interface labels».
# Numeric dates: day/month/year, 24-hour clock. Relative times are whole phrases.
# Keep Go {{.name}} and JavaScript {{name}} placeholders exactly as in English.
# Native-speaker review of this catalog and all seven emails is required before release.

