# Goiabada Simplified Chinese message catalog (zh-Hans).
#
# Register: 您 in every sentence that speaks to the reader, on every page and in every email; 你 is
# never written. Buttons, links, tabs, menu entries and titles are short verb or noun phrases (保存,
# 取消, 删除, 继续, 返回, 登录, 编辑电子邮件模板).
# Glossary: 登录 and 退出登录 (verbs, and the nouns: 登录页面, 登录尝试); 账户; 电子邮件地址, and
# 电子邮件 for a message; 密码; 用户; 管理员; 应用 for the client where the person signing in reads;
# 注册; 一次性验证码 (the authenticator's one-time code); 验证码 (the verification code sent by email);
# 双因素认证; 认证服务器; 管理控制台; 恢复代码; 身份验证器应用; 会话; 同意; 权限; 资源; 群组; 属性; 品牌;
# 审计日志; 法律文件; 电子邮件模板; 签名密钥; 设置. Three roots stay apart: 认证 for authentication, 授权
# for authorization, and 验证 for verifying a code or an address. The name fields are 姓 (family
# name), 名 (given name) and 中间名 (middle name), and a form asks for 姓 first: common.name_order is
# family_first, so it draws 姓, 名, 中间名.
# Keep token, access token, refresh token, ID token, scope, claim, issuer, client, client secret,
# redirect URI and endpoint in English, with the flow names (authorization code, client
# credentials, implicit flow, back-channel logout) and protocol names and identifiers (OAuth,
# OpenID Connect, PKCE, DPoP, UserInfo, offline_access, client_id), in Latin script as the
# specifications write them: a label uses the English plural where it names several (Clients,
# Redirect URIs), and a sentence writes the singular, since Chinese marks no number (删除此 client？).
# The person signing in reads 应用, never client.
# Typography: full-width punctuation with no space around it (，。：；？！（）), “” around quoted
# interface labels, and 、 between the items of a list. A Latin-script word, or a placeholder that
# holds one, has one half-width space between it and the Chinese beside it (删除此 client？,
# {{app_name}} 账户), and none between it and a punctuation mark. A number, or a placeholder that
# holds one, is joined to the Chinese beside it, as Chinese writes a number with its measure word
# (3天前, 至少{{.min}}个字符). The console's durations, which the browser writes ("1小时30分钟"), and the
# emails' {{expiry}} ("30分钟") follow the same rule.
# Numeric dates: year-month-day, 24-hour clock (2006-01-02 15:04). Relative times are whole phrases
# ("{{.count}}天前").
# Counted values have one form, other, the only CLDR plural category Chinese has.
# Keep Go {{.name}} and JavaScript {{name}} placeholders exactly as in English.

