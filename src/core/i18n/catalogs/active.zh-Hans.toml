# --- Names -------------------------------------------------------------------
#
# Not prose but a format: one of exactly two values, which the console's name
# forms read to choose the name they ask for first. given_first draws the given,
# middle and family names in that order; family_first draws the family name,
# then the given name, then the middle name, for a language whose forms ask for
# the family name first. Keep one of the two values exactly.
"common.name_order" = "family_first"

# --- Dates and durations -----------------------------------------------------
#
# The layout is a Go reference-time layout, translatable because Go formats
# month names in English under every locale. Translate the field order and the
# clock (12- or 24-hour); keep the reference numbers exactly — 01 month,
# 02 day, 2006 year, 03 or 15 hour, 04 minute — or no date will format. Each
# "since" value carries the whole phrase, so the count sits where the language
# puts it.
