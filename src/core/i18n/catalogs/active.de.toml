# Goiabada German catalog (de), using Germany's standard spelling across regions.
# Address readers as Sie. Prefer neutral wording where natural, without marked gender forms.
# Glossary: anmelden / abmelden; Anmeldung; Client for administrators, Anwendung for
# account holders; Einmalcode; Zwei-Faktor-Authentifizierung; Authentifizierungsserver;
# E-Mail-Adresse. Keep Token, Access Token, Refresh Token, ID Token, Scope, Claim, Subject, Endpoint,
# Backend and protocol identifiers where natural in technical copy.
# Go date layout: day.month.year, 24-hour clock. Relative times use the dative.
# Terms checked against Keycloak's German login catalog:
# https://github.com/keycloak/keycloak/blob/main/themes/src/main/resources-community/theme/base/login/messages/messages_de.properties
# Regional wording (including Swiss ss for ß) can be customized through override catalogs.
# Native-speaker review is required before release (#661).

