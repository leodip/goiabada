"auth_error.rate_limited.message" = "In kurzer Zeit wurden zu viele Anfragen von diesem Browser oder für dieses Konto gesendet. Bitte warten Sie einige Minuten und versuchen Sie es erneut."
"auth_error.unable_to_authorize.title" = "Autorisierung nicht möglich"
# Wording kept byte for byte from the error_description this condition used to redirect, so an
# integrator meets the same sentence now that it is answered on a page instead (#213).
"auth_error.unsupported_response_mode.message" = "Ungültiger Parameter response_mode. Unterstützte Werte: query, fragment, form_post."
# form_post with a redirect URI no form can post to, answered on the page for the reason the line above is (#121).
"auth_error.form_post_unreachable.code.message" = "response_mode=form_post sendet die Antwort als Formular an die Redirect-URI. Das ist nur mit den Schemas http oder https möglich. Verwenden Sie stattdessen response_mode=query oder response_mode=fragment."
"auth_error.form_post_unreachable.implicit.message" = "response_mode=form_post sendet die Antwort als Formular an die Redirect-URI. Das ist nur mit den Schemas http oder https möglich. Verwenden Sie stattdessen response_mode=fragment."
# The two below are answered on the page because the request cannot say where a redirect would go (#228).
"auth_error.malformed_request.message" = "Die Autorisierungsanfrage konnte nicht gelesen werden: Einer ihrer Parameter ist nicht korrekt codiert."
"auth_error.repeated_parameter.message" = "Der Parameter {{.parameter}} wurde mehrfach angegeben."
# A POST to the authorization endpoint is parked and answered with a redirect that carries a
