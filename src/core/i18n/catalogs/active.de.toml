"auth_error.otp_changed.message" = "Die Einstellungen zur Zwei-Faktor-Authentifizierung dieses Kontos wurden während Ihrer Anmeldung geändert. Daher kann diese Anmeldung nicht fortgesetzt werden. Kehren Sie zu der Anwendung zurück, bei der Sie sich anmelden wollten, und melden Sie sich erneut an."
