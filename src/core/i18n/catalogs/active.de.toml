"adminconsole.admin_settings.general.field.self_registration_email_verification" = "E-Mail-Bestätigung verlangen"
"adminconsole.admin_settings.general.self_registration_email_verification_tooltip" = "Ein neues Konto wird über einen Link aktiviert, der an seine E-Mail-Adresse gesendet wird. Dafür muss der E-Mail-Versand eingerichtet sein."
