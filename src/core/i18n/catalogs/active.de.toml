"auth_error.request_handle_unusable.message" = "Dieser Anmeldelink ist nicht mehr gültig. Er ist möglicherweise abgelaufen, wurde bereits verwendet oder verändert. Kehren Sie zu der Anwendung zurück, bei der Sie sich anmelden wollten, und beginnen Sie von vorn."

