# --- Dates and durations -----------------------------------------------------
#
# The layout is a Go reference-time layout, translatable because Go formats
# month names in English under every locale. Translate the field order and the
# clock (12- or 24-hour); keep the reference numbers exactly — 01 month,
# 02 day, 2006 year, 03 or 15 hour, 04 minute — or no date will format. Each
# "since" value carries the whole phrase, so the count sits where the language
# puts it.
"common.datetime.layout" = "02.01.2006 15:04"
