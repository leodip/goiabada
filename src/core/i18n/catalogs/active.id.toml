# Goiabada Indonesian message catalog (id).
#
# Register: Anda, capitalized, throughout pages, refusals and emails. Sentence case;
# imperative buttons (Masuk, Keluar, Simpan, Batal, Lanjutkan). Standard Indonesian.
# Glossary: masuk / keluar; masuk for the noun too (halaman masuk, upaya masuk, never
# login); client for administrators and aplikasi for the person signing in; kode sekali
# pakai; autentikasi dua faktor; server autentikasi; kata sandi; akun; pengguna; sesi;
# kode pemulihan; aplikasi autentikator; email, and alamat email for the address.
# Keep token, access token, refresh token, ID token, scope, claim, issuer, client,
# client secret, redirect URI and endpoint, alongside protocol names and identifiers.
# Typography: standard Indonesian punctuation (PUEBI): no space before : ; ? !, and
# "straight double quotes" around quoted interface labels.
# Numeric dates: day/month/year, 24-hour clock. Relative times are whole phrases
# ("... yang lalu"). Counted values have one form, other, the only CLDR plural category
# Indonesian has.
# Terms checked against Keycloak's Indonesian login catalog (themes/src/main/
# resources-community/theme/base/login/messages/messages_id.properties).
# Keep Go {{.name}} and JavaScript {{name}} placeholders exactly as in English.

