# The two below are answered on the page because the request cannot say where a redirect would go (#228).
"auth_error.malformed_request.message" = "Permintaan otorisasi tidak dapat dibaca: salah satu parameternya tidak dikodekan dengan benar."
"auth_error.repeated_parameter.message" = "Parameter {{.parameter}} disertakan lebih dari sekali."
# A POST to the authorization endpoint is parked and answered with a redirect that carries a
