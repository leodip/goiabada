# existed or arrived beside other parameters, so it reveals nothing about which.
"auth_error.request_handle_unusable.message" = "Tautan masuk ini sudah tidak berlaku. Tautan ini mungkin sudah kedaluwarsa, sudah digunakan, atau telah diubah. Kembali ke aplikasi tempat Anda sedang masuk dan mulai lagi."

