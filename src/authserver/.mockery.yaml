# A generated mock lives in <declaring package>/mocks, package mocks_<declaring package>,
# beside the interface it doubles rather than beside whatever implements it. A child
# package's port is satisfied structurally by its parent's mock, which lives beside the
# parent's port: apihandlers and accounthandlers restate internal/handlers' ports and
# their tests use internal/handlers/mocks (#431).
filename: "{{.InterfaceName | snakecase}}_mock.go"
structname: "{{.InterfaceName}}"
template: testify
# Emits "//go:build !production" in every generated mock, keeping testify out of
# production builds (see build/Dockerfile-*, which build with -tags=production).
#
# boilerplate-file is inlined verbatim above mockery's own "Code generated by"
# header, and src/mockery-header.txt names the generator's version, so a clone can
# read which mockery wrote the tree instead of having to run one to find out. The
# path is relative to mockery's working directory, which generate-mocks.sh sets to
# this module; core/.mockery.yaml spells the same relative path from its own module
# and both resolve to the one file at src/. Written from versions.yaml by
# ./version-manager.sh update (#338).
template-data:
  mock-build-tags: "!production"
  boilerplate-file: "../mockery-header.txt"
packages:
  # Database interface, authserver's own since #359 moved it out of core
  github.com/leodip/goiabada/authserver/internal/data:
    interfaces:
      Database:
        config:
          dir: "./internal/data/mocks"
          pkgname: "mocks_data"
  github.com/leodip/goiabada/authserver/internal/handlers:
    interfaces:
      AuthorizeValidator:
        config:
          dir: "./internal/handlers/mocks"
          pkgname: "mocks_handlers"
      PasswordValidator:
        config:
          dir: "./internal/handlers/mocks"
          pkgname: "mocks_handlers"
      TokenValidator:
        config:
          dir: "./internal/handlers/mocks"
          pkgname: "mocks_handlers"
      CodeIssuer:
        config:
          dir: "./internal/handlers/mocks"
          pkgname: "mocks_handlers"
      TokenIssuer:
        config:
          dir: "./internal/handlers/mocks"
          pkgname: "mocks_handlers"
      ImplicitTokenIssuer:
        config:
          dir: "./internal/handlers/mocks"
          pkgname: "mocks_handlers"
      TokenParser:
        config:
          dir: "./internal/handlers/mocks"
          pkgname: "mocks_handlers"
      EmailSender:
        config:
          dir: "./internal/handlers/mocks"
          pkgname: "mocks_handlers"
      CeremonyStore:
        config:
          dir: "./internal/handlers/mocks"
          pkgname: "mocks_handlers"
      PageRenderer:
        config:
          dir: "./internal/handlers/mocks"
          pkgname: "mocks_handlers"
      JSONWriter:
        config:
          dir: "./internal/handlers/mocks"
          pkgname: "mocks_handlers"
      AuditLogger:
        config:
          dir: "./internal/handlers/mocks"
          pkgname: "mocks_handlers"
      PermissionChecker:
        config:
          dir: "./internal/handlers/mocks"
          pkgname: "mocks_handlers"
      UserSessionManager:
        config:
          dir: "./internal/handlers/mocks"
          pkgname: "mocks_handlers"
      OtpSecretGenerator:
        config:
          dir: "./internal/handlers/mocks"
          pkgname: "mocks_handlers"
  # accounthandlers declares EmailValidator and UserCreator, which internal/handlers stopped
  # naming in #387, so both are generated from it and live beside it. apihandlers declares
  # the identical UserCreator, and its tests use this mock structurally (#431).
  github.com/leodip/goiabada/authserver/internal/handlers/accounthandlers:
    interfaces:
      EmailValidator:
        config:
          dir: "./internal/handlers/accounthandlers/mocks"
          pkgname: "mocks_accounthandlers"
      UserCreator:
        config:
          dir: "./internal/handlers/accounthandlers/mocks"
          pkgname: "mocks_accounthandlers"
  # protocolvalidation's own ports. Its in-package tests used internal/handlers' mocks of
  # the same names until #431. They cannot any more: the validator mocks in
  # internal/handlers/mocks import protocolvalidation for their input types, so that
  # import would be a cycle.
  github.com/leodip/goiabada/authserver/internal/protocolvalidation:
    interfaces:
      PermissionChecker:
        config:
          dir: "./internal/protocolvalidation/mocks"
          pkgname: "mocks_protocolvalidation"
      TokenParser:
        config:
          dir: "./internal/protocolvalidation/mocks"
          pkgname: "mocks_protocolvalidation"
  # Bearer-token middleware, this module's since #385 moved it out of core/middleware
  github.com/leodip/goiabada/authserver/internal/middleware:
    interfaces:
      # Unexported, so the global structname template would emit an unusable
      # lowercase type name outside the generated package. Name it explicitly (#338).
      tokenParser:
        config:
          dir: "./internal/middleware/mocks"
          pkgname: "mocks_middleware"
          structname: "TokenParser"
