{{define "title"}}{{ .appName }} - Verificación del correo{{end}}
{{define "head"}}{{end}}

{{define "body"}}
<div>
    <p>Hola, {{.name}}:</p>

    <p>Este es tu código de verificación del correo electrónico:</p>

    {{ template "email_code" . }}

    <p>Puedes escribir el código aquí: <a href="{{.link}}" style="color: {{ .emailFrame.Link }};">{{.link}}</a></p>

    <p>Un saludo,<br />{{ .appName }}</p>
</div>
{{end}}
