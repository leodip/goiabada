{{- $theme := "" }}{{ with .uiTheme }}{{ if eq . "light" "dark" }}{{ $theme = . }}{{ end }}{{ end -}}
<!DOCTYPE html>
<html lang="{{ Lang $.ctx }}"{{ with $theme }} data-theme="{{ . }}"{{ end }}>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="{{ if $theme }}{{ $theme }}{{ else }}light dark{{ end }}">
  <title>{{ template "title" . }}</title>
  <link rel="stylesheet" href="{{ asset "/static/main.css" }}">
  <link rel="icon" href="/static/favicon/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon/favicon-16x16.png">
  <link rel="manifest" href="/static/favicon/site.webmanifest">
  <script src="{{ asset "/static/utils.js" }}" defer></script>
  {{ template "head" . }}
</head>

<body>
  <main class="auth-page">
    <div class="panel auth-card{{ if .layoutWide }} auth-card-wide{{ end }}">
      <div class="panel-body">
        <p class="auth-brand">{{ .appName }}</p>
        {{ template "body" . }}
        {{ template "legal_footer" . }}
      </div>
    </div>
  </main>
</body>

{{ versionComment }}
</html>
