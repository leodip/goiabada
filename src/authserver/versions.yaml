# =============================================================================
# Goiabada Version Definitions
# =============================================================================
# This file owns the TOOLCHAIN and CDN pins. Edit it, then run:
#   ./version-manager.sh update
#
# It does NOT own the product version. That comes from the git tag and is
# injected at build time via ldflags, so the tag and the version compiled into
# the binaries cannot disagree. Releasing is:
#   git tag vX.Y.Z && git push origin vX.Y.Z
#
# Structure:
#   tools:    - Build and development tool versions
#   cdn:      - Frontend CDN dependency versions
# =============================================================================

# -----------------------------------------------------------------------------
# Tool Versions
# -----------------------------------------------------------------------------
# go:             Go language version (used in go.mod, Dockerfiles, GitHub Actions)
# tailwind:       Tailwind CSS CLI version (devcontainer, Dockerfile-test)
# golangci-lint:  Go linter version (devcontainer)
# mockery:        Mock generator version (devcontainer)
# staticcheck:    Static analyzer (devcontainer, make check)
# unparam:        Unused-parameter analyzer (devcontainer, make check)
# govulncheck:    Vulnerability scanner (devcontainer)
#
# staticcheck, unparam and govulncheck are pinned because they gate CI. An
# unpinned tool can turn every open PR red on an upstream release, with no
# change on our side. Note that upstream version schemes differ from their
# GitHub release tags: staticcheck's module version is 0.7.0 while its release
# tag is 2026.1, and golang/vuln's releases page trails its module tags. The
# Go module proxy is the source of truth for all three, which is what
# `./version-manager.sh check` queries. unparam publishes no tags at all, so it
# is pinned to a pseudo-version and every upstream commit will show up as an
# available update.
tools:
  go: "1.26.6"
  tailwind: "4.3.3"
  golangci-lint: "2.12.2"
  mockery: "3.7.3"
  staticcheck: "0.7.0"
  unparam: "0.0.0-20260813220802-35700344e60f"
  govulncheck: "1.7.0"

# -----------------------------------------------------------------------------
# CDN Dependencies
# -----------------------------------------------------------------------------
# These versions are used in HTML templates for CDN URLs (jsdelivr.net)
# daisyui:            UI component library for Tailwind
# humanize-duration:  Human-readable duration formatting (admin console)
cdn:
  daisyui: "5.7.17"
  humanize-duration: "3.34.0"
