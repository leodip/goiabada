# =============================================================================
# Goiabada Version Definitions
# =============================================================================
# This file owns the TOOLCHAIN and CDN pins. Edit it, then run:
#   ./version-manager.sh update
#
# It does NOT own the product version. That comes from the git tag and is
# injected at build time via ldflags, so the tag and the version compiled into
# the binaries cannot disagree. Releasing is:
#   git tag vX.Y.Z && git push origin vX.Y.Z
#
# Structure:
#   tools:    - Build and development tool versions
#   cdn:      - Frontend CDN dependency versions
# =============================================================================

# -----------------------------------------------------------------------------
# Tool Versions
# -----------------------------------------------------------------------------
# go:             Go language version (used in go.mod, Dockerfiles, GitHub Actions)
# tailwind:       Tailwind CSS CLI version (devcontainer)
# golangci-lint:  Go linter version (devcontainer)
# mockery:        Mock generator version (devcontainer)
# staticcheck:    Static analyzer (devcontainer, make check)
# unparam:        Unused-parameter analyzer (devcontainer, make check)
# govulncheck:    Vulnerability scanner (devcontainer)
# alpine:         Base of the release images' final stage, as major.minor
#                 (Dockerfile-authserver, Dockerfile-adminconsole)
#
# staticcheck, unparam and govulncheck are pinned because they gate CI. An
# unpinned tool can turn every open PR red on an upstream release, with no
# change on our side. Note that upstream version schemes differ from their
# GitHub release tags: staticcheck's module version is 0.7.0 while its release
# tag is 2026.1, and golang/vuln's releases page trails its module tags. The
# Go module proxy is the source of truth for all three, which is what
# `./version-manager.sh check` queries. unparam publishes no tags at all, so it
# is pinned to a pseudo-version and every upstream commit will show up as an
# available update.
#
# alpine is pinned to a minor rather than a patch: the alpine:X.Y tag receives
# Alpine's patch releases, security fixes included, at the next image build, so
# only the six-monthly minor release is a bump made here, and
# `./version-manager.sh check` reports it from alpinelinux.org. It replaced
# alpine:latest, which moved the release images to a new minor with no change
# on our side (#396).
tools:
  go: "1.27.2"
  tailwind: "4.3.3"
  golangci-lint: "2.14.0"
  mockery: "3.8.1"
  staticcheck: "0.8.2"
  unparam: "0.0.0-20261011093844-7a2c2c0b7aa6"
  govulncheck: "1.9.0"
  alpine: "3.24"

# -----------------------------------------------------------------------------
# Vendored web dependencies
# -----------------------------------------------------------------------------
# Committed into the repository by ./version-manager.sh update, which downloads the
# pinned version and records each file's SHA-256 here; no page fetches them from a CDN
# (#542). The web packages' tests hold the committed files to these digests.
# daisyui:            daisyUI's standalone-CLI bundle, built into both servers' main.css:
#                     src/{authserver,adminconsole}/web/tailwindcss/daisyui.mjs, one file
#                     in two places, from its GitHub release
# humanize-duration:  duration formatting in the admin console:
#                     src/adminconsole/web/static/vendor/humanize-duration/, from npm
# cropperjs:          image cropping in the admin console, 1.x (2.x is another API):
#                     src/adminconsole/web/static/vendor/cropperjs/, from npm
vendored:
  daisyui: "5.7.48"
  daisyui-sha256: "72ea75c3799ca80666e7e7cfc1f6904f1e0dd417eff78b3137acb64086e14270"
  humanize-duration: "3.35.0"
  humanize-duration-sha256: "fa557682d97d4cf89e978aa3d32599206e9a6b54651aa05f6b6af84d78edefcc"
  cropperjs: "1.6.2"
  cropperjs-js-sha256: "6290a3fa581b17ccf4692cf3ec617a74ae65de88d9140c72d492ae9b47707efb"
  cropperjs-css-sha256: "23679f552ce73499f817de22b5dcdd9e1e5a1e50cd9d77e34bbd31bf65a85186"
