# placido's configuration for Goiabada. Every command runs inside the issue's own
# Docker stack through .placido/stack.sh, so issues never share databases. Each one
# runs the main checkout's copy ($PLACIDO_REPO), acting on the run's worktree
# ($PLACIDO_WORKTREE), so a pull request branched before a fix to the scripts still
# gets the fix.

[project]
base     = "main"
setup    = "$PLACIDO_REPO/.placido/stack.sh up"    # builds and starts the issue's stack: every database, no published ports
teardown = "$PLACIDO_REPO/.placido/stack.sh down"   # `placido close`: removes its containers, volumes, network and image

[commands.vet]
run   = "$PLACIDO_REPO/.placido/stack.sh vet"
about = "go vet in all four modules (core, authserver, adminconsole, setup); about 30 seconds."

[commands.unit]
run   = "$PLACIDO_REPO/.placido/stack.sh run --type modules --no-build"
about = "Unit tests of authserver (internal and web), core, and adminconsole; also checks gofmt, about 40 seconds. Narrow with --type internal|core|adminconsole and --run '<regex>'; a pattern that matches no test fails the run."

[commands.setup-wizard]
run   = "$PLACIDO_REPO/.placido/stack.sh run --type setup"
about = "Tests of the setup wizard module, src/cmd/goiabada-setup."

[commands.data-sqlite]
run   = "$PLACIDO_REPO/.placido/stack.sh run --type data --db sqlite --no-build"
about = "The data-layer tier on SQLite, about 20 seconds. Narrow with --run '<regex>'. Use data for another engine."

[commands.data]
run   = "$PLACIDO_REPO/.placido/stack.sh run --type data --no-build --db"
about = "The data-layer tier on one engine: append mysql, postgres, mssql, or sqlite (about 4, 0.5, 2 minutes, and 20 seconds). Narrow with --run '<regex>'."

[commands.integration-sqlite]
run   = "$PLACIDO_REPO/.placido/stack.sh run --type integration --db sqlite"
about = "Builds the server and runs the end-to-end tier on SQLite, about a minute. Narrow with --run '<regex>'. Use integration for another engine."

[commands.integration]
run   = "$PLACIDO_REPO/.placido/stack.sh run --type integration --db"
about = "Builds the server and runs the end-to-end tier on one engine: append mysql, postgres, mssql, or sqlite (about 1, 1.5, 2 minutes, and 45 seconds). Narrow with --run '<regex>'."

[commands.lint]
run   = "$PLACIDO_REPO/.placido/stack.sh run --type lint --no-build"
about = "golangci-lint and unparam on every module, as CI's Lint job runs them, and checks that the Tailwind CSS, the mocks, and the core ownership table are committed up to date."

[commands.exec]
run   = "$PLACIDO_REPO/.placido/stack.sh exec"
about = "One command in this issue's devcontainer, from src/authserver, with its environment, for what the other commands do not cover. Append it quoted, such as 'go test -count=1 -run TestName ./internal/oauth/...' for one package."

[commands.mocks]
run   = "$PLACIDO_REPO/.placido/stack.sh exec ./generate-mocks.sh"
about = "Regenerate the mocks with the pinned mockery, after changing an interface."

[commands.schema]
run   = "$PLACIDO_REPO/.placido/stack.sh exec 'go run ./cmd/schemadump'"
about = "Regenerate the four schema.golden files, after adding or changing a migration; commit them."

[commands.ownership]
run   = "$PLACIDO_REPO/.placido/stack.sh exec 'cd ../core && go run ./cmd/ownershipdump'"
about = "Regenerate the core symbol ownership table, after adding or moving a core symbol; commit it."

[commands.e2e]
run   = "$PLACIDO_REPO/.placido/e2e.sh"
about = "Rebuilds the one shared e2e environment on the VPS from this worktree's src/ and runs the e2e suite against it (e2e/run.sh --source), the rate limiter off, about ten minutes. The rate-limits suite is not part of it: the user runs it by hand, before a release. Placido runs it as the last gate, after the review, and again on a fix of it; do not run it yourself."

[gates]
slice = ["vet", "unit"]
final = ["lint", "setup-wizard", "data-sqlite", "integration-sqlite"]
last  = ["e2e"]   # after the review, before the push: the browser suite against an environment built from the branch

# placido pr: reviewing contributors' pull requests. The reviewers are placido's
# defaults (claude opus xhigh, then codex gpt-6.1-sol max fast); the gates default to
# the slice and final ones above. src/.devcontainer joins the host paths because
# stack.sh builds its image and its compose files decide what the containers mount
# from this machine. e2e joins them because the last gate, which the menu offers, runs
# the worktree's e2e/run.sh and its Playwright suite here, with the SSH key the VPS
# accepts, and installs the suite's packages here.
[pr]
host_paths = [".placido", ".claude", ".codex", ".mcp.json", "src/.devcontainer", "e2e"]
